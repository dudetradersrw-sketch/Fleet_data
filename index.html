<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Dashboard Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <h1 class="text-xl font-bold text-gray-800">Dashboard Overview</h1>
      <button onclick="fetchDatabase()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm">🔄 Sync Data</button>
    </header>
    <div class="p-6 space-y-6" id="pageContent">Loading...</div>
  </main>
  <script>
    document.getElementById("sidebarContainer").innerHTML = renderSidebar("Dashboard");

    window.onDataLoaded = function(db) {
      const totalIncome = (db.Invoices || []).reduce((sum, i) => sum + Number(i.Paid || 0), 0);
      const totalExpense = (db.Expenses || []).reduce((sum, e) => sum + Number(e.TotalUSD || e.AmountUSD || 0), 0) * 1300;
      const profit = totalIncome - totalExpense;

      const statuses = ["Loaded", "In Transit", "Destination", "Returning", "Done", "Down Destination"];
      const counts = {};
      statuses.forEach(s => counts[s] = (db.Containers || []).filter(c => c.Status === s).length);

      document.getElementById("pageContent").innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-white p-6 rounded-xl shadow-sm border">
            <p class="text-sm text-gray-500">Total Income Collected</p>
            <h3 class="text-2xl font-bold text-green-600 mt-1">${totalIncome.toLocaleString()} RWF</h3>
          </div>
          <div class="bg-white p-6 rounded-xl shadow-sm border">
            <p class="text-sm text-gray-500">Total Expenses Recorded</p>
            <h3 class="text-2xl font-bold text-red-600 mt-1">${totalExpense.toLocaleString()} RWF</h3>
          </div>
          <div class="bg-white p-6 rounded-xl shadow-sm border">
            <p class="text-sm text-gray-500">Net Estimated Profit</p>
            <h3 class="text-2xl font-bold text-blue-600 mt-1">${profit.toLocaleString()} RWF</h3>
          </div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border mb-6">
          <h3 class="font-semibold text-gray-700 mb-4">Containers by Status</h3>
          <div class="grid grid-cols-2 md:grid-cols-6 gap-4 text-center">
            ${statuses.map(s => `<div class="bg-gray-50 p-4 rounded-lg border"><span class="block text-xs text-gray-500">${s}</span><strong class="text-xl text-gray-800">${counts[s]}</strong></div>`).join('')}
          </div>
        </div>
      `;
    };

    fetchDatabase();
  </script>
</body>
</html>
