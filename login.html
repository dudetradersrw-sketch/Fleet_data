<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 font-sans flex items-center justify-center h-screen">
  <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="text-4xl">🚚</div>
      <h1 class="text-2xl font-bold text-gray-800">FleetDesk Portal</h1>
      <p class="text-xs text-gray-500">Sign in using your assigned credentials</p>
    </div>

    <form onsubmit="handleUserLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Username</label>
        <input type="text" id="loginUsername" required placeholder="Enter username" class="border p-3 rounded-lg w-full text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="border p-3 rounded-lg w-full text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold text-sm transition shadow-lg">
        Sign In to FleetDesk
      </button>
    </form>
    
    <div class="text-center text-[11px] text-gray-400">
      Protected Logistics & Port Clearing System
    </div>
  </div>

  <script>
    // Try syncing in background, but do not block login if offline
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof fetchDatabase === 'function') {
        fetchDatabase().catch(() => console.log("Offline mode: using local user cache."));
      }
    });

    function handleUserLogin(e) {
      e.preventDefault();
      const uInput = document.getElementById("loginUsername").value.trim();
      const pInput = document.getElementById("loginPassword").value.trim();

      // 1. Master Admin Fallback Check
      if (uInput.toLowerCase() === "admin" && (pInput === "admin" || pInput === "Fleet2026@")) {
        const adminUser = {
          Username: "admin",
          Name: "System Administrator",
          Category: "Administrator",
          IsMasterAdmin: true,
          Permissions: ["All"]
        };
        localStorage.setItem("fleetDesk_currentUser", JSON.stringify(adminUser));
        sessionStorage.setItem("fleetDesk_currentUser", JSON.stringify(adminUser));
        
        if (typeof showNotification === 'function') {
          showNotification("Admin login successful!", "success");
        }
        setTimeout(() => { window.location.href = "index.html"; }, 600);
        return;
      }

      // 2. Load users from localStorage cache (ensures offline users can log in)
      let usersList = [];
      try {
        const savedDb = JSON.parse(localStorage.getItem("fleetDesk_db") || "{}");
        usersList = savedDb.Users || [];
      } catch (err) {
        usersList = [];
      }

      // Fallback to globalData if available
      if (usersList.length === 0 && typeof globalData !== 'undefined' && globalData.Users) {
        usersList = globalData.Users;
      }

      // Find user matching username and password
      const matchedUser = usersList.find(u => 
        String(u.Username).toLowerCase() === uInput.toLowerCase() && String(u.Password) === pInput
      );

      if (matchedUser) {
        localStorage.setItem("fleetDesk_currentUser", JSON.stringify(matchedUser));
        sessionStorage.setItem("fleetDesk_currentUser", JSON.stringify(matchedUser));
        
        if (typeof showNotification === 'function') {
          showNotification(`Welcome back, ${matchedUser.Name || matchedUser.Username}!`, "success");
        }
        setTimeout(() => { window.location.href = "index.html"; }, 800);
      } else {
        alert("Invalid username or password. Please check your credentials or create the user in User Management.");
      }
    }
  </script>
</body>
</html>
