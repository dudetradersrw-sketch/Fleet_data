<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetDesk - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 font-sans flex items-center justify-center h-screen">
  <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="text-4xl">🚚</div>
      <h1 class="text-2xl font-bold text-gray-800">FleetDesk Portal</h1>
      <p class="text-xs text-gray-500">Sign in using your assigned credentials</p>
    </div>

    <form onsubmit="handleUserLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Username</label>
        <input type="text" id="loginUsername" required placeholder="Enter username" class="border p-3 rounded-lg w-full text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="border p-3 rounded-lg w-full text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
      </div>
      <button type="submit" id="loginSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold text-sm transition shadow-lg flex items-center justify-center gap-2">
        <span>Sign In to FleetDesk</span>
      </button>
    </form>
    
    <div class="text-center text-[11px] text-gray-400">
      Protected Logistics & Port Clearing System
    </div>
  </div>

  <script>
  async function handleUserLogin(e) {
    e.preventDefault();
    const uInput = document.getElementById("loginUsername").value.trim();
    const pInput = document.getElementById("loginPassword").value.trim();
    const btn = document.getElementById("loginSubmitBtn");

    // 1. Master Admin Fallback Check
    if (uInput.toLowerCase() === "admin" && (pInput === "admin" || pInput === "Fleet2026@" || pInput === "admin@ndikumwe.com")) {
      const adminUser = {
        Username: "admin",
        Name: "System Administrator",
        Category: "Administrator",
        IsMasterAdmin: true,
        Permissions: ["All"]
      };
      sessionStorage.setItem("fleetDesk_currentUser", JSON.stringify(adminUser));
      localStorage.clear(); 
      window.location.href = "index.html";
      return;
    }

    // Ensure SCRIPT_URL is accessible
    const backendUrl = typeof SCRIPT_URL !== "undefined" ? SCRIPT_URL : "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    if (!backendUrl || backendUrl.includes("YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE")) {
      alert("Configuration error: SCRIPT_URL is not defined in app.js.");
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span>Verifying with Google Sheets...</span>`;

    // 2. Live JSONP backend query to Google Sheets
    try {
      const matchedUser = await new Promise((resolve) => {
        const callbackName = 'login_callback_' + Math.round(100000 * Math.random());
        
        // Timeout handling (8 seconds) in case JSONP endpoint hangs
        const timeoutId = setTimeout(() => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(null);
        }, 8000);

        window[callbackName] = function(res) {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          
          // Flexible object checking for different Google Apps Script return structures
          if (res) {
            if (res.status === "success" && res.user) resolve(res.user);
            else if (res.user) resolve(res.user);
            else if (res.Username || res.username) resolve(res); // Direct user payload return
            else resolve(null);
          } else {
            resolve(null);
          }
        };

        const script = document.createElement('script');
        script.src = `${backendUrl}?action=login&username=${encodeURIComponent(uInput)}&password=${encodeURIComponent(pInput)}&callback=${callbackName}&t=${Date.now()}`;
        
        script.onerror = function() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(null);
        };

        document.body.appendChild(script);
      });

      if (matchedUser) {
        sessionStorage.setItem("fleetDesk_currentUser", JSON.stringify(matchedUser));
        sessionStorage.removeItem("fleetDesk_db");
        window.location.href = "index.html";
      } else {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In to FleetDesk</span>`;
        alert("Invalid username or password. Please verify your credentials.");
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = `<span>Sign In to FleetDesk</span>`;
      alert("Connection error: Failed to reach Google Sheets backend.");
    }
  }
</script>
</body>
</html>
