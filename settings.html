<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - System Settings & Color Customization</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <h1 class="text-xl font-bold text-gray-800">System Settings & Appearance</h1>
      <div id="headerCenterBadge"></div>
      <button onclick="fetchDatabase(true)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition">🔄 Sync</button>
    </header>
    <div class="p-6 space-y-6" id="pageContent">
      
      <!-- Theme Selection Card -->
      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="text-lg font-bold text-gray-800 mb-1">🎨 System Color Schemes & Theme</h2>
        <p class="text-xs text-gray-500 mb-6">Select a pre-designed color theme for your sidebar and system interface.</p>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="themeCardsGrid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- General System Information -->
      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="text-lg font-bold text-gray-800 mb-4">ℹ️ System Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
          <div class="p-4 bg-gray-50 rounded-lg border">
            <span class="text-xs text-gray-500 block font-semibold">System Name</span>
            <span class="font-bold text-gray-800">FleetDesk Logistics Platform</span>
          </div>
          <div class="p-4 bg-gray-50 rounded-lg border">
            <span class="text-xs text-gray-500 block font-semibold">Backend Engine</span>
            <span class="font-bold text-gray-800">Google Apps Script API + JSONP</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.getElementById("sidebarContainer").innerHTML = renderSidebar("Settings");
    document.getElementById("headerCenterBadge").innerHTML = renderUserHeaderBadge();

    function renderSettingsPage() {
      const activeKey = getCurrentThemeKey();
      const grid = document.getElementById("themeCardsGrid");

      let html = "";
      Object.keys(THEME_PRESETS).forEach(key => {
        const theme = THEME_PRESETS[key];
        const isActive = key === activeKey;

        html += `
          <div onclick="saveSystemTheme('${key}')" class="cursor-pointer border-2 rounded-xl p-4 transition-all hover:shadow-md ${isActive ? 'border-blue-600 bg-blue-50/30' : 'border-gray-200 bg-white hover:border-gray-300'}">
            <div class="flex items-center justify-between mb-3">
              <span class="font-bold text-sm text-gray-800">${theme.name}</span>
              ${isActive ? '<span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">ACTIVE</span>' : ''}
            </div>
            
            <!-- Theme Preview Card -->
            <div class="${theme.bg} rounded-lg p-3 space-y-2 border ${theme.border}">
              <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-white/20"></div>
                <div class="h-2 w-16 bg-white/40 rounded"></div>
              </div>
              <div class="h-2 w-20 bg-white/20 rounded"></div>
              <div class="h-2 w-12 bg-white/20 rounded"></div>
            </div>

            <button class="w-full mt-4 text-xs font-semibold py-2 rounded-lg transition ${isActive ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
              ${isActive ? 'Selected' : 'Apply Theme'}
            </button>
          </div>
        `;
      });

      grid.innerHTML = html;
    }

    renderSettingsPage();
  </script>
</body>
</html>
