<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Garage & Repairs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
  <style>
    .resizer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: col-resize;
      user-select: none;
      touch-action: none;
      z-index: 5;
    }
    .resizer:hover, .resizing {
      background-color: rgba(59, 130, 246, 0.8);
    }
    th {
      position: relative;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: grab;
    }
    th:active {
      cursor: grabbing;
    }
    th.dragging {
      opacity: 0.4;
      background: #e2e8f0;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <h1 class="text-xl font-bold text-gray-800">Garage & Repairs</h1>
      <button onclick="fetchDatabase(true)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition">🔄 Sync Data</button>
    </header>
    <div class="p-6 space-y-6" id="pageContent">Loading...</div>
  </main>

  <script>
    document.getElementById("sidebarContainer").innerHTML = renderSidebar("Garage");

    let garageColumnOrder = ["ID", "Date", "Item", "Description", "Qty", "Currency", "Price", "Total (USD)", "Shop Ref", "Vehicle", "Trip", "Actions"];
    let isInitialRender = true;

    window.onDataLoaded = function(db) {
      const data = db || window.globalData || {};
      
      // Build static layout shell once, then update data dynamically
      if (isInitialRender || !document.getElementById("filter_item")) {
        buildPageShell(data);
        isInitialRender = false;
      }
      
      updateTableContent(data);
    };

    function buildPageShell(db) {
      const combinations = db.Combinations || [];
      const trucks = db.Trucks || [];
      const trailers = db.Trailers || [];
      const trips = db.Trips || [];

      // Build Vehicle filter options
      let truckFilterOptions = '<option value="">All Vehicles</option>';
      combinations.forEach(c => {
        const t = trucks.find(tr => String(tr.ID) === String(c.TruckID) || String(tr.PlateNumber) === String(c.TruckID));
        const tr = trailers.find(trl => String(trl.ID) === String(c.TrailerID) || String(trl.PlateNumber) === String(c.TrailerID));
        const tPlate = t ? (t.PlateNumber || t.Registration || t.ID) : c.TruckID;
        const trPlate = tr ? (tr.PlateNumber || tr.Registration || tr.ID) : 'No Trailer';
        truckFilterOptions += `<option value="${c.ID}">${tPlate}/${trPlate}</option>`;
      });

      // Build Trip filter options
      let tripFilterOptions = '<option value="">All Trips</option>';
      trips.forEach(tr => {
        tripFilterOptions += `<option value="${tr.ID}">Trip [${tr.TripNumber}]</option>`;
      });

      document.getElementById("pageContent").innerHTML = `
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-2">
          <button onclick="openGarageFormModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg shadow transition">
            ➕ Add Garage Record
          </button>
          <div class="text-xs text-gray-500 italic">💡 Drag column headers left/right to reposition. Drag right borders to resize widths as narrow/wide as you want.</div>
        </div>

        <!-- Advanced Filter Section (Fixed Above Table) -->
        <div class="bg-white p-4 rounded-xl shadow-sm border grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end">
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">From Date</label>
            <input type="date" id="filter_dateFrom" onchange="updateTableContent(globalData)" class="border p-2 rounded text-xs w-full outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">To Date</label>
            <input type="date" id="filter_dateTo" onchange="updateTableContent(globalData)" class="border p-2 rounded text-xs w-full outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">Spare Part / Item</label>
            <input type="text" id="filter_item" placeholder="Search item or details..." oninput="updateTableContent(globalData)" class="border p-2 rounded text-xs w-full outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">Vehicle Combination</label>
            <select id="filter_truck" onchange="updateTableContent(globalData)" class="border p-2 rounded text-xs w-full outline-none bg-white">${truckFilterOptions}</select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">Trip</label>
            <select id="filter_trip" onchange="updateTableContent(globalData)" class="border p-2 rounded text-xs w-full outline-none bg-white">${tripFilterOptions}</select>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
          <div class="p-4 border-b flex justify-between items-center">
            <span id="recordCountLabel" class="text-xs font-bold text-gray-600">Loading records...</span>
            <div class="flex items-center gap-2">
              <button onclick="exportPDFTable('Garage', window.filteredGarageList || globalData.Garage)" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm font-semibold">📥 PDF</button>
              <button onclick="exportCSVData('Garage', window.filteredGarageList || globalData.Garage)" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm font-semibold">📥 CSV</button>
            </div>
          </div>
          <div class="overflow-x-auto min-h-[300px]">
            <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table_Garage">
              <thead id="tableHeaderContainer"></thead>
              <tbody id="tableBodyContainer" class="divide-y"></tbody>
            </table>
          </div>
        </div>
      `;
    }

    function updateTableContent(db) {
      const garageList = db.Garage || [];
      const combinations = db.Combinations || [];
      const trucks = db.Trucks || [];
      const trailers = db.Trailers || [];
      const trips = db.Trips || [];

      // Capture active filter values without losing focus
      const filterFrom = document.getElementById("filter_dateFrom")?.value || "";
      const filterTo = document.getElementById("filter_dateTo")?.value || "";
      const filterItem = document.getElementById("filter_item")?.value.toLowerCase() || "";
      const filterTruck = document.getElementById("filter_truck")?.value || "";
      const filterTrip = document.getElementById("filter_trip")?.value || "";

      // Filter logic
      const filteredList = garageList.filter(g => {
        if (filterFrom && g.Date < filterFrom) return false;
        if (filterTo && g.Date > filterTo) return false;
        if (filterItem && !((g.Item && g.Item.toLowerCase().includes(filterItem)) || (g.Description && g.Description.toLowerCase().includes(filterItem)))) return false;
        if (filterTruck && String(g.TruckID) !== String(filterTruck)) return false;
        if (filterTrip && String(g.TripID) !== String(filterTrip)) return false;
        return true;
      });

      window.filteredGarageList = filteredList;

      let tableRows = "";
      filteredList.forEach(g => {
        const combination = combinations.find(c => String(c.ID) === String(g.TruckID) || String(c.TruckID) === String(g.TruckID));
        let displayVehicle = g.TruckID || 'N/A';

        if (combination) {
          const t = trucks.find(tr => String(tr.ID) === String(combination.TruckID) || String(tr.PlateNumber) === String(combination.TruckID));
          const tr = trailers.find(trl => String(trl.ID) === String(combination.TrailerID) || String(trl.PlateNumber) === String(combination.TrailerID));
          const tPlate = t ? (t.PlateNumber || t.Registration || t.ID) : combination.TruckID;
          const trPlate = tr ? (tr.PlateNumber || tr.Registration || tr.ID) : 'No Trailer';
          displayVehicle = `${tPlate}/${trPlate}`;
        } else {
          const t = trucks.find(tr => String(tr.ID) === String(g.TruckID) || String(tr.PlateNumber) === String(g.TruckID));
          if (t) displayVehicle = t.PlateNumber || t.Registration || t.ID;
        }

        const trip = trips.find(tr => String(tr.ID) === String(g.TripID));
        const displayTrip = trip ? `Trip [${trip.TripNumber}]` : 'None';

        let cells = "";
        garageColumnOrder.forEach(col => {
          if (col === "ID") cells += `<td class="p-3 text-xs text-gray-500">${g.ID || ''}</td>`;
          else if (col === "Date") cells += `<td class="p-3 text-xs">${g.Date || ''}</td>`;
          else if (col === "Item") cells += `<td class="p-3 font-semibold text-gray-800">${g.Item || ''}</td>`;
          else if (col === "Description") cells += `<td class="p-3 text-gray-600 text-xs">${g.Description || ''}</td>`;
          else if (col === "Qty") cells += `<td class="p-3">${g.Qty || ''}</td>`;
          else if (col === "Currency") cells += `<td class="p-3">${g.Currency || 'USD'}</td>`;
          else if (col === "Price") cells += `<td class="p-3">${g.Price || ''}</td>`;
          else if (col === "Total (USD)") cells += `<td class="p-3 font-semibold text-blue-600">$${g.TotalUSD || g.PriceUSD || 0}</td>`;
          else if (col === "Shop Ref") cells += `<td class="p-3 text-gray-600 text-xs">${g.ShopRef || ''}</td>`;
          else if (col === "Vehicle") cells += `<td class="p-3 font-semibold text-indigo-700">🚛 ${displayVehicle}</td>`;
          else if (col === "Trip") cells += `<td class="p-3 font-medium text-blue-600">🚀 ${displayTrip}</td>`;
          else if (col === "Actions") {
            cells += `
              <td class="p-3 text-center relative overflow-visible">
                <div class="inline-block relative">
                  <button onclick="toggleActionDropdown('${g.ID}')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded text-xs font-semibold transition border shadow-sm">
                    Actions ▼
                  </button>
                  <div id="actionMenu_${g.ID}" class="hidden absolute right-0 mt-1 w-40 bg-white border border-gray-200 rounded-lg shadow-2xl z-50 py-1 text-left text-xs space-y-0.5">
                    <button onclick="editRecord('Garage', '${g.ID}')" class="w-full text-left px-3 py-2 hover:bg-amber-50 text-amber-800 font-medium">✏️ Edit</button>
                    <button onclick="previewRecord('Garage', '${g.ID}')" class="w-full text-left px-3 py-2 hover:bg-blue-50 text-blue-800 font-medium">👁️ Preview</button>
                    <button onclick="downloadReceipt('Garage', '${g.ID}')" class="w-full text-left px-3 py-2 hover:bg-indigo-50 text-indigo-800 font-medium">📄 Download</button>
                    <button onclick="archiveRecord('Garage', '${g.ID}')" class="w-full text-left px-3 py-2 hover:bg-gray-50 text-gray-800 font-medium">📦 Archive</button>
                    <button onclick="deleteRecord('Garage', '${g.ID}')" class="w-full text-left px-3 py-2 hover:bg-red-50 text-red-800 font-medium border-t">🗑️ Delete</button>
                  </div>
                </div>
              </td>
            `;
          }
        });

        tableRows += `<tr class="hover:bg-gray-50 border-b">${cells}</tr>`;
      });

      // Build Header items with draggable attributes
      let headerCells = "";
      garageColumnOrder.forEach((col, index) => {
        const alignClass = col === "Actions" ? "text-center" : "text-left";
        headerCells += `
          <th class="p-3 ${alignClass}" draggable="true" data-index="${index}" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
            ${col}
          </th>
        `;
      });

      document.getElementById("tableHeaderContainer").innerHTML = `<tr class="bg-gray-50 text-gray-500 text-xs">${headerCells}</tr>`;
      document.getElementById("tableBodyContainer").innerHTML = tableRows || '<tr><td colspan="12" class="p-4 text-center text-gray-400">No matching garage records found.</td></tr>';
      document.getElementById("recordCountLabel").innerText = `Showing ${filteredList.length} of ${garageList.length} records`;

      makeTableResizable(document.getElementById('table_Garage'));
    }

    // --- Column Drag & Drop Reordering Logic ---
    let draggedIndex = null;

    function handleDragStart(e) {
      draggedIndex = parseInt(e.target.closest('th').getAttribute('data-index'));
      e.target.closest('th').classList.add('dragging');
    }

    function handleDragOver(e) {
      e.preventDefault();
      const th = e.target.closest('th');
      if (th) th.style.backgroundColor = '#eff6ff';
    }

    function handleDragLeave(e) {
      const th = e.target.closest('th');
      if (th) th.style.backgroundColor = '';
    }

    function handleDrop(e) {
      e.preventDefault();
      const targetTh = e.target.closest('th');
      if (!targetTh) return;
      targetTh.style.backgroundColor = '';

      const targetIndex = parseInt(targetTh.getAttribute('data-index'));
      if (draggedIndex !== null && draggedIndex !== targetIndex) {
        const movedCol = garageColumnOrder.splice(draggedIndex, 1)[0];
        garageColumnOrder.splice(targetIndex, 0, movedCol);
        updateTableContent(globalData);
      }
    }

    // --- Unrestricted Column Resizing Logic ---
    function makeTableResizable(table) {
      if (!table) return;
      const headers = table.querySelectorAll('th');
      headers.forEach(th => {
        if (th.querySelector('.resizer')) return;

        const resizer = document.createElement('div');
        resizer.className = 'resizer';
        th.appendChild(resizer);

        let x = 0;
        let w = 0;

        resizer.addEventListener('mousedown', function(e) {
          x = e.clientX;
          w = th.offsetWidth;
          resizer.classList.add('resizing');
          
          function mouseMoveHandler(e) {
            const dx = e.clientX - x;
            const newWidth = Math.max(15, w + dx); // Unrestricted width adjustment down to 15px
            th.style.width = `${newWidth}px`;
          }

          function mouseUpHandler() {
            resizer.classList.remove('resizing');
            document.removeEventListener('mousemove', mouseMoveHandler);
            document.removeEventListener('mouseup', mouseUpHandler);
          }

          document.addEventListener('mousemove', mouseMoveHandler);
          document.addEventListener('mouseup', mouseUpHandler);
        });
      });
    }

    function toggleActionDropdown(id) {
      document.querySelectorAll("[id^='actionMenu_']").forEach(menu => {
        if (menu.id !== `actionMenu_${id}`) menu.classList.add('hidden');
      });
      const menu = document.getElementById(`actionMenu_${id}`);
      if (menu) menu.classList.toggle('hidden');
    }

    window.addEventListener('click', function(e) {
      if (!e.target.closest("button[onclick^='toggleActionDropdown']")) {
        document.querySelectorAll("[id^='actionMenu_']").forEach(menu => menu.classList.add('hidden'));
      }
    });

    function openGarageFormModal(item = null) {
      const combinations = globalData.Combinations || [];
      const trucks = globalData.Trucks || [];
      const trailers = globalData.Trailers || [];
      const trips = globalData.Trips || [];

      let tripOptions = '<option value="">Select Trip (Optional)</option>';
      trips.forEach(tr => {
        const selected = item && item.TripID === tr.ID ? 'selected' : '';
        tripOptions += `<option value="${tr.ID}" ${selected}>Trip [${tr.TripNumber}]</option>`;
      });

      let combOptions = '<option value="">Select Vehicle Combination</option>';
      combinations.forEach(c => {
        const t = trucks.find(tr => String(tr.ID) === String(c.TruckID) || String(tr.PlateNumber) === String(c.TruckID));
        const tr = trailers.find(trl => String(trl.ID) === String(c.TrailerID) || String(trl.PlateNumber) === String(c.TrailerID));
        const tPlate = t ? (t.PlateNumber || t.Registration || t.ID) : c.TruckID;
        const trPlate = tr ? (tr.PlateNumber || tr.Registration || tr.ID) : 'No Trailer';
        const comboLabel = `${tPlate}/${trPlate}`;
        
        const selected = item && (String(item.TruckID) === String(c.ID) || String(item.TruckID) === String(c.ID)) ? 'selected' : '';
        combOptions += `<option value="${c.ID}" ${selected}>${comboLabel}</option>`;
      });

      const html = `
        <form onsubmit="submitGarageForm(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="hidden" id="g_edit_id" value="${item ? item.ID : ''}">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Date</label>
            <input type="date" id="g_date" value="${item ? item.Date || '' : new Date().toISOString().split('T')[0]}" required class="border p-2 rounded w-full text-sm outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Spare Part / Item</label>
            <input type="text" id="g_item" value="${item ? item.Item || '' : ''}" placeholder="e.g. Engine Oil, Brake Pads" required class="border p-2 rounded w-full text-sm outline-none">
          </div>
          <div class="md:col-span-2">
            <label class="text-xs text-gray-500 block mb-1">Description</label>
            <input type="text" id="g_desc" value="${item ? item.Description || '' : ''}" placeholder="Repair details" required class="border p-2 rounded w-full text-sm outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Quantity</label>
            <input type="number" id="g_qty" value="${item ? item.Qty || 1 : 1}" required class="border p-2 rounded w-full text-sm outline-none" oninput="calcGarageModalTotal()">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Currency & Price</label>
            <div class="flex gap-2">
              <select id="g_curr" class="border p-2 rounded w-1/3 text-sm outline-none bg-white" onchange="calcGarageModalTotal()">
                <option value="USD" ${item && item.Currency === 'USD' ? 'selected' : ''}>USD ($)</option>
                <option value="RWF" ${item && item.Currency === 'RWF' ? 'selected' : ''}>RWF (FRW)</option>
              </select>
              <input type="number" step="0.01" id="g_price" value="${item ? item.Price || '' : ''}" placeholder="Price" required class="border p-2 rounded w-2/3 text-sm outline-none" oninput="calcGarageModalTotal()">
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Exchange Rate to USD</label>
            <input type="number" step="0.0001" id="g_rate" value="${item ? item.ExchangeRate || 1380 : 1380}" class="border p-2 rounded w-full text-sm outline-none" oninput="calcGarageModalTotal()">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Total USD (Auto)</label>
            <input type="text" id="g_total" value="${item ? item.TotalUSD || '' : ''}" readonly class="border p-2 rounded w-full bg-gray-50 font-bold text-sm outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Shop Name & No</label>
            <input type="text" id="g_shop" value="${item ? item.ShopRef || '' : ''}" placeholder="Shop reference" required class="border p-2 rounded w-full text-sm outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Vehicle Combination</label>
            <select id="g_truck" required class="border p-2 rounded w-full text-sm outline-none bg-white">${combOptions}</select>
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Attach to Trip</label>
            <select id="g_trip" class="border p-2 rounded w-full text-sm outline-none bg-white">${tripOptions}</select>
          </div>
          <button type="submit" class="md:col-span-2 bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">
            ${item ? 'Update Garage Record' : 'Save Garage Record'}
          </button>
        </form>
      `;
      openFormModal(item ? `Edit Garage Record: ${item.ID}` : "Record Garage Repair", html);
    }

    function calcGarageModalTotal() {
      const qty = parseFloat(document.getElementById("g_qty").value) || 0;
      const price = parseFloat(document.getElementById("g_price").value) || 0;
      const curr = document.getElementById("g_curr").value;
      const rate = parseFloat(document.getElementById("g_rate").value) || 1380;
      let totalUSD = qty * price;
      if (curr === "RWF") totalUSD = (qty * price) / (rate || 1380);
      document.getElementById("g_total").value = totalUSD.toFixed(2);
    }

    window.onEditTriggered = function(sheetName, item) {
      if (sheetName === 'Garage') openGarageFormModal(item);
    };

    async function submitGarageForm(e) {
      e.preventDefault();
      const editId = document.getElementById("g_edit_id").value;
      const data = {
        ID: editId || ("GAR-" + Date.now().toString().slice(-4)),
        Date: document.getElementById("g_date").value,
        Item: document.getElementById("g_item").value,
        Description: document.getElementById("g_desc").value,
        Qty: document.getElementById("g_qty").value,
        Currency: document.getElementById("g_curr").value,
        Price: document.getElementById("g_price").value,
        ExchangeRate: document.getElementById("g_rate").value,
        TotalUSD: document.getElementById("g_total").value,
        ShopRef: document.getElementById("g_shop").value,
        TruckID: document.getElementById("g_truck").value,
        TripID: document.getElementById("g_trip").value
      };
      await sendToServer("Garage", editId ? "update" : "add", data);
    }

    if (typeof fetchDatabase === "function") {
      fetchDatabase();
    } else if (window.globalData) {
      window.onDataLoaded(window.globalData);
    }
  </script>
</body>
</html>
