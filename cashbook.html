<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Cashbook & Multi-Account Cash Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <h1 class="text-xl font-bold text-gray-800">Cashbook & Account Management</h1>
      <div id="headerCenterBadge"></div>
      <button onclick="fetchDatabase(true)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition flex items-center gap-1">
        🔄 <span>Sync</span>
      </button>
    </header>
    <div class="p-6 space-y-6" id="pageContent">Loading...</div>
  </main>

  <script>
    document.getElementById("sidebarContainer").innerHTML = renderSidebar("Cashbook");
    document.getElementById("headerCenterBadge").innerHTML = renderUserHeaderBadge();

    let currentTab = 'all'; // 'all', 'received', 'used', 'exchange'
    let searchQuery = '';

    window.onDataLoaded = function(db) {
      // Ensure default accounts exist if missing
      if (!db.CashAccounts || db.CashAccounts.length === 0) {
        db.CashAccounts = [
          { ID: "ACC-01", Name: "USD Main Cash", Currency: "USD", InitialBalance: 0 },
          { ID: "ACC-02", Name: "FRW Main Cash", Currency: "FRW", InitialBalance: 0 }
        ];
      }
      renderCashbookPage();
    };

    function switchTab(tab) {
      currentTab = tab;
      renderCashbookPage();
    }

    // Fixed search handler to prevent focus loss
    function handleSearch(e) {
      searchQuery = e.target.value.toLowerCase();
      const db = globalData || {};
      const cashbook = db.Cashbook || [];
      const accounts = db.CashAccounts || [];
      
      const tableContainer = document.getElementById("tableContainer");
      if (tableContainer) {
        tableContainer.innerHTML = renderTable(cashbook, accounts);
      }
    }

    function renderCashbookPage() {
      const db = globalData || {};
      const cashbook = db.Cashbook || [];
      const accounts = db.CashAccounts || [];

      // Calculate account balances dynamically from transaction history
      accounts.forEach(acc => {
        let bal = parseFloat(acc.InitialBalance || 0);
        cashbook.forEach(tx => {
          const amt = parseFloat(tx.Amount || 0);
          const exRate = parseFloat(tx.ExchangeRate || 1);

          if (tx.Type === 'Received' && String(tx.AccountID) === String(acc.ID)) {
            const finalAmt = tx.Currency !== acc.Currency 
              ? (acc.Currency === 'USD' ? amt / exRate : amt * exRate) 
              : amt;
            bal += finalAmt;
          } else if (tx.Type === 'Used' && String(tx.AccountID) === String(acc.ID)) {
            const finalAmt = tx.Currency !== acc.Currency 
              ? (acc.Currency === 'USD' ? amt / exRate : amt * exRate) 
              : amt;
            bal -= finalAmt;
          } else if (tx.Type === 'Exchange') {
            if (String(tx.FromAccountID) === String(acc.ID)) {
              bal -= parseFloat(tx.FromAmount || 0);
            }
            if (String(tx.ToAccountID) === String(acc.ID)) {
              bal += parseFloat(tx.ToAmount || 0);
            }
          }
        });
        acc.CurrentBalance = bal;
      });

      // Render Summary Account Cards
      let accountCardsHtml = accounts.map(acc => `
        <div class="bg-white p-4 rounded-xl border shadow-sm border-l-4 ${acc.Currency === 'USD' ? 'border-l-emerald-500' : 'border-l-blue-500'}">
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-gray-500 uppercase">${acc.Name}</span>
            <span class="bg-gray-100 text-gray-700 font-bold px-2 py-0.5 rounded text-[10px]">${acc.Currency}</span>
          </div>
          <div class="text-xl font-bold text-gray-800 mt-2">
            ${acc.Currency === 'USD' ? '$' : ''}${acc.CurrentBalance.toLocaleString('en-US', {minimumFractionDigits: 2})} ${acc.Currency !== 'USD' ? acc.Currency : ''}
          </div>
        </div>
      `).join('');

      let contentHtml = `
        <!-- Live Cash Accounts Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          ${accountCardsHtml}
          <button onclick="openCreateAccountModal()" class="bg-gray-50 border-2 border-dashed border-gray-300 hover:border-blue-500 hover:bg-blue-50 rounded-xl p-4 flex flex-col items-center justify-center text-gray-500 hover:text-blue-600 transition font-semibold text-sm">
            ➕ Add Cash / Bank Account
          </button>
        </div>

        <!-- Action Bar & Tabs -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-4 rounded-xl shadow-sm border">
          <div class="flex flex-wrap gap-2 bg-gray-100 p-1 rounded-lg">
            <button onclick="switchTab('all')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition ${currentTab === 'all' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}">All Transactions</button>
            <button onclick="switchTab('received')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition ${currentTab === 'received' ? 'bg-white text-emerald-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}">📥 Money Received</button>
            <button onclick="switchTab('used')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition ${currentTab === 'used' ? 'bg-white text-red-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}">📤 Money Used</button>
            <button onclick="switchTab('exchange')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition ${currentTab === 'exchange' ? 'bg-white text-purple-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}">🔀 Exchanges</button>
          </div>

          <div class="flex items-center gap-2 w-full md:w-auto">
            <input type="text" id="searchInput" placeholder="🔍 Search records..." value="${searchQuery}" oninput="handleSearch(event)" class="border p-2 rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64">
            <button onclick="exportFilteredPDF()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1" title="Download Report">📄 Report</button>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="openReceiveModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-2 rounded-lg text-xs shadow transition">➕ Receive</button>
            <button onclick="openSpendModal()" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-3 py-2 rounded-lg text-xs shadow transition">➖ Spend</button>
            <button onclick="openExchangeModal()" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-3 py-2 rounded-lg text-xs shadow transition">🔀 Exchange</button>
          </div>
        </div>

        <!-- Transactions Ledger Table Wrapper -->
        <div id="tableContainer">
          ${renderTable(cashbook, accounts)}
        </div>
      `;

      document.getElementById("pageContent").innerHTML = contentHtml;
    }

    function renderTable(cashbook, accounts) {
      let filtered = cashbook;
      if (currentTab === 'received') filtered = cashbook.filter(c => c.Type === 'Received');
      if (currentTab === 'used') filtered = cashbook.filter(c => c.Type === 'Used');
      if (currentTab === 'exchange') filtered = cashbook.filter(c => c.Type === 'Exchange');

      if (searchQuery) {
        filtered = filtered.filter(tx => 
          Object.values(tx).some(val => String(val || '').toLowerCase().includes(searchQuery))
        );
      }

      let rows = "";
      filtered.forEach(tx => {
        let typeBadge = "";
        if (tx.Type === 'Received') typeBadge = '<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-xs font-semibold">📥 Received</span>';
        else if (tx.Type === 'Used') typeBadge = '<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded text-xs font-semibold">📤 Used</span>';
        else typeBadge = '<span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded text-xs font-semibold">🔀 Exchange</span>';

        let accountDisplay = "";
        if (tx.Type === 'Exchange') {
          const fromAcc = accounts.find(a => String(a.ID) === String(tx.FromAccountID)) || { Name: tx.FromAccount || 'Source' };
          const toAcc = accounts.find(a => String(a.ID) === String(tx.ToAccountID)) || { Name: tx.ToAccount || 'Destination' };
          accountDisplay = `<span class="text-xs font-semibold text-purple-800">${fromAcc.Name} ➔ ${toAcc.Name}</span>`;
        } else {
          const acc = accounts.find(a => String(a.ID) === String(tx.AccountID)) || { Name: tx.AccountName || 'Account' };
          accountDisplay = `<span class="bg-gray-100 px-2 py-0.5 rounded font-medium text-gray-700 text-xs">${acc.Name}</span>`;
        }

        let amountDisplay = "";
        if (tx.Type === 'Exchange') {
          amountDisplay = `<span class="font-bold text-purple-700">${tx.FromAmount} ${tx.FromCurrency} ➔ ${tx.ToAmount} ${tx.ToCurrency}</span>`;
        } else {
          amountDisplay = `<span class="font-bold ${tx.Type === 'Received' ? 'text-emerald-600' : 'text-red-600'}">${parseFloat(tx.Amount || 0).toLocaleString()} ${tx.Currency}</span>`;
        }

        rows += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3 text-gray-600 text-xs">${tx.Date || '-'}</td>
            <td class="p-3">${typeBadge}</td>
            <td class="p-3 font-semibold text-gray-800 text-xs">${tx.Party || tx.Recipient || tx.ReceivedFrom || 'N/A'}</td>
            <td class="p-3 text-gray-600 text-xs">${tx.Reason || '-'}</td>
            <td class="p-3 text-xs font-semibold text-blue-600">${tx.ContainerRef || tx.TruckRef || '-'}</td>
            <td class="p-3 text-xs">${accountDisplay}</td>
            <td class="p-3 text-xs text-center">${tx.ExchangeRate ? tx.ExchangeRate : '-'}</td>
            <td class="p-3">${amountDisplay}</td>
            <td class="p-3 text-center">
              ${tx.Attachment ? `<a href="#" onclick="alert('File attachment: ${tx.Attachment}')" class="text-xs text-blue-600 underline">📎 File</a>` : '<span class="text-gray-400 text-xs">None</span>'}
            </td>
            <td class="p-3 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button onclick="downloadTransactionReceipt('${tx.ID}')" title="Download PDF Receipt" class="p-1.5 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded-lg text-xs transition">📄</button>
                <button onclick="deleteCashTransaction('${tx.ID}')" title="Delete" class="p-1.5 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg text-xs transition">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      });

      return `
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
          <div class="p-4 border-b font-bold text-gray-700 flex justify-between items-center text-sm">
            <span>Cashbook Ledger Records</span>
            <span class="text-xs text-gray-500 font-normal">Showing ${filtered.length} records</span>
          </div>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="bg-gray-50 text-gray-500 text-xs">
                <th class="p-3">Date</th>
                <th class="p-3">Type</th>
                <th class="p-3">Party</th>
                <th class="p-3">Reason</th>
                <th class="p-3">Ref (Truck/Container)</th>
                <th class="p-3">Account(s) Involved</th>
                <th class="p-3 text-center">Exchange Rate</th>
                <th class="p-3">Amount</th>
                <th class="p-3 text-center">Attachment</th>
                <th class="p-3 text-center">Actions</th>
              </tr>
            </thead>
            <tbody>${rows || '<tr><td colspan="10" class="p-4 text-center text-gray-400">No transactions found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }

    // Modal: Create New Account
    function openCreateAccountModal() {
      const html = `
        <form onsubmit="submitAccountForm(event)" class="space-y-4">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Account Name / Bank</label>
            <input type="text" id="acc_name" placeholder="e.g. Bank of Kigali USD, Equity FRW, Petty Cash" required class="border p-2 rounded w-full text-sm outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Account Currency</label>
            <select id="acc_currency" class="border p-2 rounded w-full text-sm outline-none bg-white">
              <option value="USD">USD ($)</option>
              <option value="FRW">FRW (RWF)</option>
              <option value="EUR">EUR (€)</option>
              <option value="KES">KES</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Opening / Initial Balance</label>
            <input type="number" id="acc_init_bal" value="0" step="0.01" class="border p-2 rounded w-full text-sm outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">
            ➕ Create Account
          </button>
        </form>
      `;

      openFormModal("Create New Cash / Bank Account", html);
    }

    async function submitAccountForm(e) {
      e.preventDefault();
      const newAcc = {
        ID: "ACC-" + Date.now().toString().slice(-4),
        Name: document.getElementById("acc_name").value,
        Currency: document.getElementById("acc_currency").value,
        InitialBalance: parseFloat(document.getElementById("acc_init_bal").value || 0)
      };

      await sendToServer("CashAccounts", "add", newAcc);
    }

    // Modal: Money Received
    function openReceiveModal() {
      const accounts = globalData.CashAccounts || [];
      const contacts = globalData.Contacts || [];

      const accountOpts = accounts.map(a => `<option value="${a.ID}">${a.Name} (${a.Currency})</option>`).join('');
      const contactOpts = contacts.map(c => `<option value="${c.Name || c.ContactName}">${c.Name || c.ContactName}</option>`).join('');

      const html = `
        <form onsubmit="submitReceiveForm(event)" class="space-y-4">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Date</label>
            <input type="date" id="cb_date" value="${new Date().toISOString().split('T')[0]}" required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Received From (Contact)</label>
            <input type="text" id="cb_from" list="contactsList" placeholder="Select or type contact name" required class="border p-2 rounded w-full text-sm outline-none">
            <datalist id="contactsList">${contactOpts}</datalist>
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Reason / Description</label>
            <input type="text" id="cb_reason" placeholder="Payment for trip, invoice, deposit, etc." required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500 block mb-1">Target Account Paid To</label>
              <select id="cb_account_id" class="border p-2 rounded w-full text-sm outline-none bg-white">
                ${accountOpts || '<option value="">No accounts found</option>'}
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">Currency Received in Hand</label>
              <select id="cb_curr" class="border p-2 rounded w-full text-sm outline-none bg-white">
                <option value="USD">USD ($)</option>
                <option value="FRW">FRW (RWF)</option>
              </select>
            </div>
          </div>

          <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-200">
            <label class="text-xs text-emerald-800 block mb-1 font-semibold">Exchange Rate (If currency received differs from account currency)</label>
            <input type="number" id="cb_ex_rate" value="1380" step="0.01" class="border p-2 rounded w-full text-sm outline-none bg-white">
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Amount</label>
            <input type="number" id="cb_amount" step="0.01" required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Attach Receipt / Document</label>
            <input type="file" id="cb_file" accept=".pdf,.png,.jpg,.jpeg,.csv,.xlsx,.xls" class="border p-2 rounded w-full text-xs">
          </div>

          <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition">
            📥 Save Received Money Entry
          </button>
        </form>
      `;

      openFormModal("Record Money Received", html);
    }

    // Modal: Money Used / Spent
    function openSpendModal() {
      const accounts = globalData.CashAccounts || [];
      const containers = globalData.Containers || [];
      const trucks = globalData.Trucks || [];

      const accountOpts = accounts.map(a => `<option value="${a.ID}">${a.Name} (${a.Currency})</option>`).join('');
      const containerOpts = containers.map(c => `<option value="${c.ContainerNumber}">${c.ContainerNumber}</option>`).join('');
      const truckOpts = trucks.map(t => `<option value="${t.PlateNumber}">${t.PlateNumber}</option>`).join('');

      const html = `
        <form onsubmit="submitSpendForm(event)" class="space-y-4">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Date</label>
            <input type="date" id="sp_date" value="${new Date().toISOString().split('T')[0]}" required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Recipient / Paid To</label>
            <input type="text" id="sp_recipient" placeholder="Supplier, vendor, driver, garage, etc." required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Reason / Purpose</label>
            <input type="text" id="sp_reason" placeholder="Fuel, maintenance, allowance, toll fee, etc." required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500 block mb-1">Reference Container (Optional)</label>
              <input type="text" id="sp_container" list="containerList" placeholder="Container number" class="border p-2 rounded w-full text-sm outline-none">
              <datalist id="containerList">${containerOpts}</datalist>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">Reference Truck (Optional)</label>
              <input type="text" id="sp_truck" list="truckList" placeholder="Truck plate" class="border p-2 rounded w-full text-sm outline-none">
              <datalist id="truckList">${truckOpts}</datalist>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500 block mb-1">Account Spent From</label>
              <select id="sp_account_id" class="border p-2 rounded w-full text-sm outline-none bg-white">
                ${accountOpts || '<option value="">No accounts found</option>'}
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">Currency Spent</label>
              <select id="sp_curr" class="border p-2 rounded w-full text-sm outline-none bg-white">
                <option value="USD">USD ($)</option>
                <option value="FRW">FRW (RWF)</option>
              </select>
            </div>
          </div>

          <div class="bg-red-50 p-3 rounded-lg border border-red-200">
            <label class="text-xs text-red-800 block mb-1 font-semibold">Exchange Rate (If currency spent differs from account currency)</label>
            <input type="number" id="sp_ex_rate" value="1380" step="0.01" class="border p-2 rounded w-full text-sm outline-none bg-white">
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Amount Spent</label>
            <input type="number" id="sp_amount" step="0.01" required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Attach Receipt / Document</label>
            <input type="file" id="sp_file" accept=".pdf,.png,.jpg,.jpeg,.csv,.xlsx,.xls" class="border p-2 rounded w-full text-xs">
          </div>

          <button type="submit" class="w-full bg-red-600 text-white py-2.5 rounded-lg font-semibold hover:bg-red-700 transition">
            📤 Save Money Used Entry
          </button>
        </form>
      `;

      openFormModal("Record Money Used / Spent", html);
    }

    // Modal: Currency Exchange
    function openExchangeModal() {
      const accounts = globalData.CashAccounts || [];
      const accountOpts = accounts.map(a => `<option value="${a.ID}">${a.Name} (${a.Currency})</option>`).join('');

      const html = `
        <form onsubmit="submitExchangeForm(event)" class="space-y-4">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Date</label>
            <input type="date" id="ex_date" value="${new Date().toISOString().split('T')[0]}" required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500 block mb-1">From Account (Source)</label>
              <select id="ex_from_id" class="border p-2 rounded w-full text-sm outline-none bg-white">
                ${accountOpts}
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">To Account (Destination)</label>
              <select id="ex_to_id" class="border p-2 rounded w-full text-sm outline-none bg-white">
                ${accountOpts}
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500 block mb-1">Amount Withdrawn from Source Account</label>
              <input type="number" id="ex_from_amt" step="0.01" required placeholder="e.g. 1000" class="border p-2 rounded w-full text-sm outline-none">
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">Amount Deposited to Destination Account</label>
              <input type="number" id="ex_to_amt" step="0.01" required placeholder="e.g. 1380000" class="border p-2 rounded w-full text-sm outline-none">
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Exchange Rate Used (1 USD = FRW)</label>
            <input type="number" id="ex_rate" value="1380" step="0.01" required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <!-- Exchange Service Charge Section -->
          <div class="border-t pt-3 bg-purple-50 p-3 rounded-lg border border-purple-200 space-y-3">
            <span class="text-xs font-bold text-purple-900 block">Bank / Exchange Service Charges (Auto-posted to Expenses)</span>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-gray-600 block mb-1">Charge Amount</label>
                <input type="number" id="ex_fee_amt" value="0" step="0.01" class="border p-2 rounded w-full text-sm outline-none bg-white">
              </div>
              <div>
                <label class="text-xs text-gray-600 block mb-1">Charge Currency</label>
                <select id="ex_fee_curr" class="border p-2 rounded w-full text-sm outline-none bg-white">
                  <option value="USD">USD ($)</option>
                  <option value="FRW">FRW (RWF)</option>
                  <option value="EUR">EUR (€)</option>
                </select>
              </div>
            </div>
          </div>

          <button type="submit" class="w-full bg-purple-600 text-white py-2.5 rounded-lg font-semibold hover:bg-purple-700 transition">
            🔀 Execute Currency Exchange
          </button>
        </form>
      `;

      openFormModal("Currency Exchange & Account Transfer", html);
    }

    // Submissions
    async function submitReceiveForm(e) {
      e.preventDefault();
      const accounts = globalData.CashAccounts || [];
      const accId = document.getElementById('cb_account_id').value;
      const acc = accounts.find(a => String(a.ID) === String(accId));

      const fileInput = document.getElementById('cb_file');
      let attachmentUrl = fileInput.files.length > 0 ? fileInput.files[0].name : '';

      const record = {
        ID: "CB-" + Date.now().toString().slice(-6),
        Type: "Received",
        Date: document.getElementById('cb_date').value,
        Party: document.getElementById('cb_from').value,
        Reason: document.getElementById('cb_reason').value,
        AccountID: accId,
        AccountName: acc ? acc.Name : '',
        Currency: document.getElementById('cb_curr').value,
        ExchangeRate: document.getElementById('cb_ex_rate').value || 1,
        Amount: document.getElementById('cb_amount').value,
        Attachment: attachmentUrl
      };

      await sendToServer("Cashbook", "add", record);
    }

      const fileInput = document.getElementById('sp_file');

    async function submitExchangeForm(e) {
      e.preventDefault();
      const accounts = globalData.CashAccounts || [];
      const fromId = document.getElementById('ex_from_id').value;
      const toId = document.getElementById('ex_to_id').value;

      const fromAcc = accounts.find(a => String(a.ID) === String(fromId));
      const toAcc = accounts.find(a => String(a.ID) === String(toId));

      const feeAmt = parseFloat(document.getElementById('ex_fee_amt').value || 0);
      const feeCurr = document.getElementById('ex_fee_curr').value;

      const record = {
        ID: "CB-EX-" + Date.now().toString().slice(-6),
        Type: "Exchange",
        Date: document.getElementById('ex_date').value,
        FromAccountID: fromId,
        ToAccountID: toId,
        FromCurrency: fromAcc ? fromAcc.Currency : '',
        ToCurrency: toAcc ? toAcc.Currency : '',
        FromAmount: document.getElementById('ex_from_amt').value,
        ToAmount: document.getElementById('ex_to_amt').value,
        ExchangeRate: document.getElementById('ex_rate').value,
        ExchangeFee: feeAmt,
        ExchangeFeeCurrency: feeCurr,
        Reason: `Currency Exchange (${fromAcc ? fromAcc.Name : ''} ➔ ${toAcc ? toAcc.Name : ''})`
      };

      await sendToServer("Cashbook", "add", record);

      if (feeAmt > 0) {
        const expenseRecord = {
          ID: "EXP-FEE-" + Date.now().toString().slice(-6),
          Date: document.getElementById('ex_date').value,
          Category: "Bank & Exchange Charges",
          Description: `Exchange Fee for transfer (${fromAcc ? fromAcc.Name : ''} ➔ ${toAcc ? toAcc.Name : ''})`,
          Amount: feeAmt,
          Currency: feeCurr,
          Reference: record.ID
        };
        await sendToServer("Expenses", "add", expenseRecord);
      }
    }

    function downloadTransactionReceipt(id) {
      const cashbook = globalData.Cashbook || [];
      const tx = cashbook.find(c => String(c.ID) === String(id));
      if (!tx) return alert("Transaction not found.");

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("FLEETDESK - CASHBOOK RECEIPT", 105, 20, { align: "center" });
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`Transaction ID: ${tx.ID} | Date: ${tx.Date}`, 105, 28, { align: "center" });
      doc.line(20, 35, 190, 35);

      let y = 48;
      Object.keys(tx).forEach(key => {
        doc.setFont("helvetica", "bold");
        doc.text(`${key}:`, 20, y);
        doc.setFont("helvetica", "normal");
        doc.text(String(tx[key] || ''), 70, y);
        y += 10;
      });

      doc.save(`Receipt_${tx.ID}.pdf`);
    }

    function exportFilteredPDF() {
      const cashbook = globalData.Cashbook || [];
      exportPDFTable("Cashbook", cashbook);
    }

    async function deleteCashTransaction(id) {
      if (confirm("Permanently delete this transaction?")) {
        await sendToServer("Cashbook", "delete", { id });
      }
    }

    fetchDatabase();
  </script>
