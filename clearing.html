<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Port Clearing & Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-3 flex justify-between items-center sticky top-0 z-20 shadow-sm">
      <h1 class="text-lg font-bold text-gray-800">Port Clearing Operations</h1>
      <div class="flex items-center gap-2">
        <button onclick="fetchDatabase(true)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg text-xs transition">🔄 Sync Data</button>
      </div>
    </header>
    <div class="p-4 space-y-4 flex-1 flex flex-col" id="pageContent">Loading clearing operations...</div>
  </main>

  <script>
    // Fallback if renderSidebar is missing from app.js
    if (typeof renderSidebar === 'function') {
      document.getElementById("sidebarContainer").innerHTML = renderSidebar("Clearing");
    } else {
      document.getElementById("sidebarContainer").innerHTML = `<div class="w-64 bg-slate-900 text-white p-4 h-full"><b>FleetDesk</b></div>`;
    }

    window.onDataLoaded = function(db) {
      db = db || {};
      const clearingList = db.Clearing || [];
      const paymentsList = db.ClearingPayments || [];
      const invoicesList = db.ClearingInvoices || [];

      let totalClearingAndTransport = 0;
      let totalAllExpenses = 0;
      clearingList.forEach(item => {
        const clearing = parseFloat(item.ClearingAmount) || 0;
        const transport = parseFloat(item.TransportAmount) || 0;
        const storage = parseFloat(item.StorageAmount) || 0;
        const rent = parseFloat(item.RentAmount) || 0;
        const demurrage = parseFloat(item.DemurrageAmount) || 0;

        totalClearingAndTransport += (clearing + transport);
        totalAllExpenses += (clearing + transport + storage + rent + demurrage);
      });

      invoicesList.forEach(inv => {
        if (Array.isArray(inv.ExtraCharges)) {
          inv.ExtraCharges.forEach(ec => {
            totalAllExpenses += (parseFloat(ec.amount) || 0);
          });
        }
      });

      let totalPaid = paymentsList.reduce((sum, p) => sum + (parseFloat(p.AmountPaid) || 0), 0);
      let balanceOwed = totalAllExpenses - totalPaid;

      let tableRows = "";
      clearingList.forEach(item => {
        tableRows += `
          <tr class="hover:bg-gray-50 border-b cursor-pointer" onclick="alert('Viewing clearing item: ${item.ContainerNo}')">
            <td class="p-3 text-xs text-gray-500 font-mono">${item.ID || ''}</td>
            <td class="p-3 font-bold text-gray-800">📦 ${item.ContainerNo || ''}</td>
            <td class="p-3 text-xs text-blue-600">${item.BLno || ''}</td>
            <td class="p-3 text-xs">${item.Consignee || ''}</td>
            <td class="p-3 font-semibold text-indigo-700">${item.Client || ''}</td>
            <td class="p-3 text-xs">${item.Port || ''}</td>
            <td class="p-3 text-xs">${item.Destination || ''}</td>
            <td class="p-3 font-semibold text-blue-600">$${parseFloat(item.ClearingAmount || 0).toFixed(2)}</td>
            <td class="p-3 font-semibold text-emerald-600">$${parseFloat(item.TransportAmount || 0).toFixed(2)}</td>
            <td class="p-3 font-semibold text-red-600">$${parseFloat(item.StorageAmount || 0).toFixed(2)}</td>
          </tr>
        `;
      });

      document.getElementById("pageContent").innerHTML = `
        <div class="bg-white p-2.5 rounded-xl border shadow-sm flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button onclick="alert('Open form')" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs shadow transition">
              ➕ Add Port Clearing File
            </button>
          </div>
          <div class="flex items-center gap-2 text-xs">
            <div class="bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-lg">
              <span class="text-[10px] text-blue-600 font-semibold block uppercase">Clr+Trans</span>
              <span class="font-bold text-blue-900">$${totalClearingAndTransport.toFixed(2)}</span>
            </div>
            <div class="bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-lg">
              <span class="text-[10px] text-slate-600 font-semibold block uppercase">Total Expenses</span>
              <span class="font-bold text-slate-900">$${totalAllExpenses.toFixed(2)}</span>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 flex flex-col">
          <div class="overflow-x-auto flex-1 min-h-[300px]">
            <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
              <thead>
                <tr class="bg-gray-100 text-gray-600 text-xs">
                  <th class="p-3">ID</th>
                  <th class="p-3">Container No</th>
                  <th class="p-3">BL No</th>
                  <th class="p-3">Consignee</th>
                  <th class="p-3">Client</th>
                  <th class="p-3">Port</th>
                  <th class="p-3">Destination</th>
                  <th class="p-3">Clearing ($)</th>
                  <th class="p-3">Transport ($)</th>
                  <th class="p-3">Storage ($)</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                ${tableRows || '<tr><td colspan="10" class="p-6 text-center text-gray-400">No clearing files found in database.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    };

    // Auto-trigger fetch if app.js doesn't trigger onDataLoaded automatically
    if (typeof fetchDatabase === 'function') {
      fetchDatabase();
    } else {
      setTimeout(() => {
        if (document.getElementById("pageContent").innerHTML.includes("Loading")) {
          document.getElementById("pageContent").innerHTML = `<div class="p-6 text-center text-red-500 font-semibold">Error: app.js failed to load or connect properly. Please check your file path.</div>`;
        }
      }, 3000);
    }
  </script>
</body>
</html>
