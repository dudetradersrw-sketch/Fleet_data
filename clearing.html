<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Port Clearing & Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-3 flex justify-between items-center sticky top-0 z-20 shadow-sm">
      <h1 class="text-lg font-bold text-gray-800">Port Clearing Operations</h1>
      <div class="flex items-center gap-2">
        <button onclick="fetchDatabase(true)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg text-xs transition">🔄 Sync Data</button>
      </div>
    </header>
    <div class="p-4 space-y-4 flex-1 flex flex-col" id="pageContent">Loading...</div>
  </main>

  <!-- Global Hidden File Input for Multi-File Attachment -->
  <input type="file" id="globalMultiFileInput" multiple class="hidden" onchange="handleMultiFileSelection(event)">

  <!-- 📂 Dedicated Files Management Modal -->
  <div id="filesModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden" onclick="if(event.target === this) closeFilesModal()">
    <div class="bg-white rounded-xl max-w-xl w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeFilesModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      <h3 id="filesModalTitle" class="text-xl font-bold text-gray-800 mb-2 border-b pb-2">Manage Attachments</h3>
      <p class="text-xs text-gray-500 mb-4">View, preview, download, or add multiple documents for this clearing file.</p>
      
      <div id="filesModalBody" class="space-y-3 mb-6"></div>

      <div class="flex justify-between items-center border-t pt-4">
        <button onclick="triggerMultiFileInputForExisting()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
          <span>➕ Add More Files</span>
        </button>
        <button onclick="closeFilesModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-gray-300">Close</button>
      </div>
    </div>
  </div>

  <!-- 👁️ File Preview Modal -->
  <div id="filePreviewModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden" onclick="if(event.target === this) closeFilePreviewModal()">
    <div class="bg-white rounded-xl max-w-4xl w-full p-4 shadow-2xl relative max-h-[95vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h3 id="previewFileTitle" class="text-base font-bold text-gray-800 truncate">Document Preview</h3>
        <button onclick="closeFilePreviewModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>
      <div id="filePreviewBody" class="flex-1 overflow-auto flex items-center justify-center min-h-[400px] bg-gray-50 rounded-lg p-2"></div>
    </div>
  </div>

  <!-- 📝 Quick Notes Modal -->
  <div id="quickNotesModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden" onclick="if(event.target === this) closeQuickNotesModal()">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeQuickNotesModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      <h3 id="quickNotesTitle" class="text-xl font-bold text-gray-800 mb-2 border-b pb-2">Manage Charge Notes</h3>
      <div id="quickNotesBody" class="space-y-4 pt-2"></div>
    </div>
  </div>

  <!-- 💵 Invoice Payment Modal -->
  <div id="invoicePaymentModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden" onclick="if(event.target === this) closeInvoicePaymentModal()">
    <div class="bg-white rounded-xl max-w-3xl w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeInvoicePaymentModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      <h3 class="text-xl font-bold text-gray-800 mb-2 border-b pb-2">Custom Invoice Payment Allocation</h3>
      <div id="invoicePaymentBody" class="space-y-4 pt-2"></div>
    </div>
  </div>

  <!-- 📑 Global All Invoices Modal -->
  <div id="allInvoicesModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden" onclick="if(event.target === this) closeAllInvoicesModal()">
    <div class="bg-white rounded-xl max-w-6xl w-full p-6 shadow-xl relative max-h-[92vh] overflow-y-auto">
      <button onclick="closeAllInvoicesModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      <h3 class="text-xl font-bold text-gray-800 mb-2 border-b pb-2">All Agent & Transporter Invoices</h3>
      <div id="allInvoicesModalBody" class="space-y-4 pt-2"></div>
    </div>
  </div>

  <!-- 💳 Global All Payments Modal -->
  <div id="allPaymentsModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden" onclick="if(event.target === this) closeAllPaymentsModal()">
    <div class="bg-white rounded-xl max-w-5xl w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeAllPaymentsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      <h3 class="text-xl font-bold text-gray-800 mb-2 border-b pb-2">All Payment Records</h3>
      <div id="allPaymentsModalBody" class="space-y-4 pt-2"></div>
    </div>
  </div>

<script>
    if (typeof renderSidebar === 'function') {
      document.getElementById("sidebarContainer").innerHTML = renderSidebar("Clearing");
    }

    let currentActiveRecordId = null;
    let formModalActiveFiles = [];
    let invoiceExtraChargesList = [];

    // --- FINANCIAL HELPER FOR INVOICES (REMEMBERING PAYMENTS & TRANSACTION IDs) ---
    function getInvoiceFinancials(inv, allExtraCharges) {
      allExtraCharges = allExtraCharges || globalData.ClearingExtraCharges || [];
      const invCharges = allExtraCharges.filter(function(ec) { return String(ec.InvoiceID) === String(inv.ID); });
      let extraChargesTotal = 0;
      invCharges.forEach(function(ec) { extraChargesTotal += (parseFloat(ec.Amount) || 0); });

      const grandTotal = (parseFloat(inv.Amount) || 0) + extraChargesTotal;
      
      let alreadyPaid = 0;
      if (Array.isArray(inv.PaymentRecords) && inv.PaymentRecords.length > 0) {
        inv.PaymentRecords.forEach(function(pr) {
          alreadyPaid += (parseFloat(pr.amount) || 0);
        });
      } else if (typeof inv.PaidAmount !== 'undefined' && !isNaN(inv.PaidAmount)) {
        alreadyPaid = parseFloat(inv.PaidAmount) || 0;
      } else if (inv.Status === 'Fully Paid') {
        alreadyPaid = grandTotal;
      } else {
        alreadyPaid = 0;
      }

      alreadyPaid = Math.min(grandTotal, Math.max(0, alreadyPaid));
      const remainingDue = Math.max(0, grandTotal - alreadyPaid);

      let statusLabel = 'Unpaid';
      if (remainingDue === 0 && grandTotal > 0) {
        statusLabel = 'Fully Paid';
      } else if (alreadyPaid > 0) {
        statusLabel = 'Part Paid';
      }

      return {
        grandTotal: grandTotal,
        alreadyPaid: alreadyPaid,
        remainingDue: remainingDue,
        extraChargesTotal: extraChargesTotal,
        invCharges: invCharges,
        statusLabel: statusLabel,
        paymentRecords: inv.PaymentRecords || []
      };
    }

    // --- CLOSE ALL MODALS HELPER ---
    function closeAllModals() {
      const modals = ['filesModal', 'filePreviewModal', 'quickNotesModal', 'invoicePaymentModal', 'allInvoicesModal', 'allPaymentsModal', 'previewModal', 'formModal'];
      modals.forEach(function(mId) {
        const el = document.getElementById(mId);
        if (el) el.classList.add('hidden');
      });
      currentActiveRecordId = null;
    }

    // --- ACTION CELL HELPER ---
    function renderClearingActionCell(sheetName, item) {
      const id = item.ID;
      const attachments = Array.isArray(item.Attachments) ? item.Attachments : (item.AttachmentData ? [1] : []);
      const count = attachments.length;

      return '<div class="inline-block relative text-left">' +
        '<button onclick="toggleActionDropdown(\'' + id + '\')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded text-xs font-semibold transition border">Actions ▼</button>' +
        '<div id="actionMenu_' + id + '" class="hidden absolute right-0 mt-1 w-44 bg-white border border-gray-200 rounded-lg shadow-xl z-20 py-1 text-left text-xs flex flex-col space-y-0.5">' +
          '<button onclick="editRecord(\'' + sheetName + '\', \'' + id + '\')" class="w-full text-left px-3 py-1.5 hover:bg-amber-50 text-amber-800 font-medium">✏️ Edit</button>' +
          '<button onclick="previewClearingDetails(\'' + id + '\')" class="w-full text-left px-3 py-1.5 hover:bg-blue-50 text-blue-800 font-medium">👁️ Preview</button>' +
          '<button onclick="openFilesModal(\'' + id + '\')" class="w-full text-left px-3 py-1.5 hover:bg-indigo-50 text-indigo-800 font-medium flex justify-between items-center"><span>📁 Files (' + count + ')</span><span class="text-[10px] bg-indigo-100 text-indigo-800 px-1.5 rounded-full">Manage</span></button>' +
          '<button onclick="downloadReceipt(\'' + sheetName + '\', \'' + id + '\')" class="w-full text-left px-3 py-1.5 hover:bg-indigo-50 text-indigo-800 font-medium">📄 Download Receipt</button>' +
          '<button onclick="archiveRecord(\'' + sheetName + '\', \'' + id + '\')" class="w-full text-left px-3 py-1.5 hover:bg-gray-50 text-gray-800 font-medium">📦 Archive</button>' +
          '<button onclick="deleteRecord(\'' + sheetName + '\', \'' + id + '\')" class="w-full text-left px-3 py-1.5 hover:bg-red-50 text-red-800 font-medium border-t">🗑️ Delete</button>' +
        '</div>' +
      '</div>';
    }

    // --- MULTI-FILE ATTACHMENT HANDLERS ---
    function triggerMultiFileInput() {
      const input = document.getElementById("globalMultiFileInput");
      if (input) input.click();
    }

    function triggerMultiFileInputForExisting() {
      const input = document.getElementById("globalMultiFileInput");
      if (input) input.click();
    }

    async function handleMultiFileSelection(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      if (typeof formModalActiveFiles !== 'undefined' && document.getElementById("formModal") && !document.getElementById("formModal").classList.contains("hidden")) {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          await processFileIntoArray(file, formModalActiveFiles);
        }
        renderFormFilesList();
        if (typeof showNotification === 'function') showNotification(files.length + " file(s) added to form!");
        event.target.value = "";
        return;
      }

      if (currentActiveRecordId) {
        const item = (globalData.Clearing || []).find(x => String(x.ID) === String(currentActiveRecordId));
        if (item) {
          if (!Array.isArray(item.Attachments)) item.Attachments = [];
          
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            await processFileIntoArray(file, item.Attachments);
          }
          await sendToServer("Clearing", "update", item);
          if (typeof showNotification === 'function') showNotification(files.length + " file(s) attached successfully!");
          openFilesModal(currentActiveRecordId);
        }
        currentActiveRecordId = null;
        event.target.value = "";
      }
    }

    function processFileIntoArray(file, targetArray) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          targetArray.push({
            name: file.name,
            type: file.type,
            data: e.target.result
          });
          resolve();
        };
        reader.readAsDataURL(file);
      });
    }

    function openFilesModal(id) {
      closeAllModals();
      currentActiveRecordId = id;
      const item = (globalData.Clearing || []).find(x => String(x.ID) === String(id));
      if (!item) return alert("Record not found.");

      const attachments = Array.isArray(item.Attachments) ? item.Attachments : (item.AttachmentData ? [{name: item.AttachmentName || 'Document', data: item.AttachmentData}] : []);

      document.getElementById("filesModalTitle").innerText = "Attachments: " + (item.ContainerNo || '');
      const body = document.getElementById("filesModalBody");

      if (attachments.length === 0) {
        body.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-4">No attachments found for this file.</p>';
      } else {
        body.innerHTML = attachments.map(function(att, idx) {
          return '<div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-lg border">' +
            '<span class="text-xs font-semibold text-gray-700 truncate max-w-[200px]">📎 ' + att.name + '</span>' +
            '<div class="flex items-center gap-2">' +
              '<button onclick="previewSingleFile(\'' + att.name + '\', \'' + att.data + '\', \'' + (att.type || '') + '\')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded text-xs font-medium">Preview</button>' +
              '<a href="' + att.data + '" download="' + att.name + '" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded text-xs font-medium">Download</a>' +
              '<button onclick="removeAttachment(\'' + id + '\', ' + idx + ')" class="bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1 rounded text-xs font-medium">Delete</button>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      document.getElementById("filesModal").classList.remove("hidden");
    }

    function closeFilesModal() {
      document.getElementById("filesModal").classList.add("hidden");
    }

    function previewSingleFile(name, dataUrl, fileType) {
      document.getElementById("previewFileTitle").innerText = "Preview: " + name;
      const previewBody = document.getElementById("filePreviewBody");

      if (fileType.indexOf("image") !== -1 || dataUrl.startsWith("data:image")) {
        previewBody.innerHTML = '<img src="' + dataUrl + '" alt="' + name + '" class="max-h-[75vh] max-w-full rounded-lg shadow object-contain" />';
      } else if (fileType.indexOf("pdf") !== -1 || dataUrl.startsWith("data:application/pdf")) {
        previewBody.innerHTML = '<iframe src="' + dataUrl + '" class="w-full h-[75vh] rounded-lg border"></iframe>';
      } else {
        previewBody.innerHTML = '<div class="text-center py-10 space-y-3">' +
          '<p class="text-sm text-gray-600">Inline preview is not available for this file type.</p>' +
          '<a href="' + dataUrl + '" download="' + name + '" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-semibold inline-block">Download to View</a>' +
        '</div>';
      }

      document.getElementById("filePreviewModal").classList.remove("hidden");
    }

    function closeFilePreviewModal() {
      document.getElementById("filePreviewModal").classList.add("hidden");
    }

    async function removeAttachment(recordId, index) {
      if (!confirm("Remove this attachment?")) return;
      const item = (globalData.Clearing || []).find(x => String(x.ID) === String(recordId));
      if (item && Array.isArray(item.Attachments)) {
        item.Attachments.splice(index, 1);
        await sendToServer("Clearing", "update", item);
        if (typeof showNotification === 'function') showNotification("Attachment removed.");
        openFilesModal(recordId);
      }
    }

    // --- QUICK NOTES HELPER & MODAL ---
    let quickEditNotesList = { storage: [], rent: [], demurrage: [] };

    function openQuickNotesModal(id) {
      closeAllModals();
      currentActiveRecordId = id;
      const item = (globalData.Clearing || []).find(x => String(x.ID) === String(id));
      if (!item) return;

      quickEditNotesList = {
        storage: Array.isArray(item.StorageNotesList) ? [...item.StorageNotesList] : (item.StorageNotes ? [item.StorageNotes] : []),
        rent: Array.isArray(item.RentNotesList) ? [...item.RentNotesList] : (item.RentNotes ? [item.RentNotes] : []),
        demurrage: Array.isArray(item.DemurrageNotesList) ? [...item.DemurrageNotesList] : (item.DemurrageNotes ? [item.DemurrageNotes] : [])
      };

      document.getElementById("quickNotesTitle").innerText = "Notes & Logs: " + (item.ContainerNo || '');
      renderQuickNotesBody();
      document.getElementById("quickNotesModal").classList.remove("hidden");
    }

    function closeQuickNotesModal() {
      document.getElementById("quickNotesModal").classList.add("hidden");
    }

    function addQuickNoteEntry(type) {
      quickEditNotesList[type].push("");
      renderQuickNotesBody();
    }

    function removeQuickNoteEntry(type, index) {
      quickEditNotesList[type].splice(index, 1);
      renderQuickNotesBody();
    }

    function updateQuickNoteEntry(type, index, value) {
      quickEditNotesList[type][index] = value;
    }

    function renderQuickNotesBody() {
      const container = document.getElementById("quickNotesBody");
      container.innerHTML = '<div class="space-y-4">' +
        '<div class="bg-gray-50 p-3 rounded-lg border space-y-2">' +
          '<div class="flex justify-between items-center">' +
            '<span class="text-xs font-bold text-gray-700">Storage Logs:</span>' +
            '<button type="button" onclick="addQuickNoteEntry(\'storage\')" class="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs font-semibold">+ Add Note</button>' +
          '</div>' +
          (quickEditNotesList.storage.length === 0 ? '<p class="text-xs text-gray-400 italic">No notes.</p>' : 
            quickEditNotesList.storage.map(function(n, idx) {
              return '<div class="flex items-center gap-2">' +
                '<input type="text" value="' + n + '" oninput="updateQuickNoteEntry(\'storage\', ' + idx + ', this.value)" class="border p-1.5 rounded w-full text-xs bg-white outline-none">' +
                '<button type="button" onclick="removeQuickNoteEntry(\'storage\', ' + idx + ')" class="text-red-600 font-bold px-1 text-xs">✕</button>' +
              '</div>';
            }).join('')) +
        '</div>' +
        '<div class="bg-gray-50 p-3 rounded-lg border space-y-2">' +
          '<div class="flex justify-between items-center">' +
            '<span class="text-xs font-bold text-gray-700">Warehouse Rent Logs:</span>' +
            '<button type="button" onclick="addQuickNoteEntry(\'rent\')" class="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs font-semibold">+ Add Note</button>' +
          '</div>' +
          (quickEditNotesList.rent.length === 0 ? '<p class="text-xs text-gray-400 italic">No notes.</p>' : 
            quickEditNotesList.rent.map(function(n, idx) {
              return '<div class="flex items-center gap-2">' +
                '<input type="text" value="' + n + '" oninput="updateQuickNoteEntry(\'rent\', ' + idx + ', this.value)" class="border p-1.5 rounded w-full text-xs bg-white outline-none">' +
                '<button type="button" onclick="removeQuickNoteEntry(\'rent\', ' + idx + ')" class="text-red-600 font-bold px-1 text-xs">✕</button>' +
              '</div>';
            }).join('')) +
        '</div>' +
        '<div class="bg-gray-50 p-3 rounded-lg border space-y-2">' +
          '<div class="flex justify-between items-center">' +
            '<span class="text-xs font-bold text-gray-700">Demurrage Logs:</span>' +
            '<button type="button" onclick="addQuickNoteEntry(\'demurrage\')" class="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs font-semibold">+ Add Note</button>' +
          '</div>' +
          (quickEditNotesList.demurrage.length === 0 ? '<p class="text-xs text-gray-400 italic">No notes.</p>' : 
            quickEditNotesList.demurrage.map(function(n, idx) {
              return '<div class="flex items-center gap-2">' +
                '<input type="text" value="' + n + '" oninput="updateQuickNoteEntry(\'demurrage\', ' + idx + ', this.value)" class="border p-1.5 rounded w-full text-xs bg-white outline-none">' +
                '<button type="button" onclick="removeQuickNoteEntry(\'demurrage\', ' + idx + ')" class="text-red-600 font-bold px-1 text-xs">✕</button>' +
              '</div>';
            }).join('')) +
        '</div>' +
        '<button onclick="saveQuickNotes()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold text-xs shadow transition">Save Notes</button>' +
      '</div>';
    }

    async function saveQuickNotes() {
      if (!currentActiveRecordId) return;
      const item = (globalData.Clearing || []).find(x => String(x.ID) === String(currentActiveRecordId));
      if (!item) return;

      item.StorageNotesList = quickEditNotesList.storage;
      item.RentNotesList = quickEditNotesList.rent;
      item.DemurrageNotesList = quickEditNotesList.demurrage;

      await sendToServer("Clearing", "update", item);
      closeQuickNotesModal();
      if (typeof showNotification === 'function') showNotification("Notes updated successfully!");
    }

    // --- MULTIPLE NOTES HELPER FOR FORM ---
    let activeLogNotes = { storage: [], rent: [], demurrage: [] };

    function addLogNoteEntry(type, text) {
      text = text || "";
      activeLogNotes[type].push(text);
      renderLogNotesList(type);
    }

    function removeLogNoteEntry(type, index) {
      activeLogNotes[type].splice(index, 1);
      renderLogNotesList(type);
    }

    function updateLogNoteEntry(type, index, value) {
      activeLogNotes[type][index] = value;
    }

    function renderLogNotesList(type) {
      const container = document.getElementById(type + "_notes_container");
      if (!container) return;

      if (activeLogNotes[type].length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-400 italic">No notes added yet.</p>';
        return;
      }

      container.innerHTML = activeLogNotes[type].map(function(note, idx) {
        return '<div class="flex items-center gap-2 mb-2">' +
          '<input type="text" value="' + note + '" oninput="updateLogNoteEntry(\'' + type + '\', ' + idx + ', this.value)" placeholder="Enter note description..." class="border p-1.5 rounded w-full text-xs outline-none bg-white">' +
          '<button type="button" onclick="removeLogNoteEntry(\'' + type + '\', ' + idx + ')" class="bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1.5 rounded text-xs font-bold">✕</button>' +
        '</div>';
      }).join('');
    }

    // --- UNIVERSAL MULTI-COLUMN SEARCH & FILTER LOGIC ---
    function applyUniversalSearchAndFilter() {
      const query = (document.getElementById("universalSearchInput")?.value || "").toLowerCase().trim();
      const clientFilter = (document.getElementById("filterClient")?.value || "").toLowerCase();
      const portFilter = (document.getElementById("filterPort")?.value || "").toLowerCase();
      const transporterFilter = (document.getElementById("filterTransporter")?.value || "").toLowerCase();

      const tbody = document.getElementById("clearingTableBody");
      if (!tbody) return;

      const rows = tbody.getElementsByTagName("tr");
      let visibleCount = 0;

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (row.id === "noResultsRow") continue;

        const textContent = row.textContent.toLowerCase();
        const clientVal = (row.getAttribute("data-client") || "").toLowerCase();
        const portVal = (row.getAttribute("data-port") || "").toLowerCase();
        const transporterVal = (row.getAttribute("data-transporter") || "").toLowerCase();

        const matchesSearch = !query || textContent.includes(query);
        const matchesClient = !clientFilter || clientVal === clientFilter;
        const matchesPort = !portFilter || portVal === portFilter;
        const matchesTransporter = !transporterFilter || transporterVal === transporterFilter;

        if (matchesSearch && matchesClient && matchesPort && matchesTransporter) {
          row.style.display = "";
          visibleCount++;
        } else {
          row.style.display = "none";
        }
      }

      let noResultsRow = document.getElementById("noResultsRow");
      if (visibleCount === 0) {
        if (!noResultsRow) {
          noResultsRow = document.createElement("tr");
          noResultsRow.id = "noResultsRow";
          noResultsRow.innerHTML = '<td colspan="20" class="p-4 text-center text-gray-400">No matching clearing files found.</td>';
          tbody.appendChild(noResultsRow);
        } else {
          noResultsRow.style.display = "";
        }
      } else if (noResultsRow) {
        noResultsRow.style.display = "none";
      }
    }

    // --- RENDER TABLE & DATA ---

    function toggleAllClearingCheckboxes(masterCheckbox) {
      document.querySelectorAll('.clearing-file-checkbox').forEach(function(cb) {
        cb.checked = masterCheckbox.checked;
      });
    }

    function openBatchClearingPaymentModal() {
      closeAllModals();
      const checkedBoxes = document.querySelectorAll('.clearing-file-checkbox:checked');
      if (checkedBoxes.length === 0) {
        alert("Please select at least one clearing file using the checkboxes in the table.");
        return;
      }

      let totalAmount = 0;
      let containerList = [];
      let clearingIds = [];

      checkedBoxes.forEach(function(cb) {
        totalAmount += parseFloat(cb.getAttribute('data-amount')) || 0;
        containerList.push(cb.getAttribute('data-container'));
        clearingIds.push(cb.value);
      });

      const today = new Date().toISOString().split("T")[0];

      const html = '<form onsubmit="submitBatchClearingPayment(event, \'' + clearingIds.join(',') + '\')" class="space-y-4">' +
        '<div><label class="text-xs text-gray-500 block mb-1 font-semibold">Selected Containers (' + checkedBoxes.length + ')</label><input type="text" value="' + containerList.join(', ') + '" disabled class="border p-2 rounded w-full text-xs bg-gray-50 font-medium"></div>' +
        '<div class="grid grid-cols-2 gap-3">' +
          '<div><label class="text-xs text-gray-500 block mb-1 font-semibold">Payment Date</label><input type="date" id="batch_pay_date" value="' + today + '" required class="border p-2 rounded w-full text-xs outline-none bg-white"></div>' +
          '<div><label class="text-xs text-gray-500 block mb-1 font-semibold">Total Amount Paid ($)</label><input type="number" step="0.01" id="batch_pay_amount" value="' + totalAmount.toFixed(2) + '" required class="border p-2 rounded w-full text-xs font-bold text-emerald-600 outline-none"></div>' +
        '</div>' +
        '<button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition text-xs shadow">Confirm & Record Batch Payment</button>' +
      '</form>';

      document.getElementById("invoicePaymentBody").innerHTML = html;
      document.getElementById("invoicePaymentModal").classList.remove("hidden");
    }

    async function submitBatchClearingPayment(e, clearingIdsStr) {
      e.preventDefault();
      const ids = clearingIdsStr.split(",");
      const payAmount = parseFloat(document.getElementById("batch_pay_amount").value) || 0;
      const payDate = document.getElementById("batch_pay_date").value;

      if (!globalData.ClearingPayments) globalData.ClearingPayments = [];

      const newPayment = {
        ID: "PAY-" + Date.now().toString().slice(-4),
        Date: payDate,
        BeneficiaryName: "Multiple Clearing Files (" + ids.length + ")",
        AmountPaid: payAmount,
        InvoicesPaid: "Clearing IDs: " + ids.join(", ")
      };

      await sendToServer("ClearingPayments", "add", newPayment);
      closeInvoicePaymentModal();
      if (typeof showNotification === 'function') showNotification("Batch payment recorded successfully!");
      if (typeof fetchDatabase === 'function') fetchDatabase(true);
    }

        '</div>' +
        '<button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition text-xs shadow">Confirm & Record Custom Payment</button>' +

    function closeInvoicePaymentModal() {
      document.getElementById("invoicePaymentModal").classList.add("hidden");
    }

    function recalculateBatchPaymentTotal() {
      let grandTotal = 0;
      const rows = document.querySelectorAll("#customPaymentTable tbody tr");

      rows.forEach(function(row) {
        const totalDue = parseFloat(row.getAttribute("data-total")) || 0;
        const paidBefore = parseFloat(row.getAttribute("data-paid-before")) || 0;
        const inputVal = parseFloat(row.querySelector(".inv-pay-input").value) || 0;

        grandTotal += inputVal;

        const newTotalPaid = paidBefore + inputVal;
        const remainingBalance = Math.max(0, totalDue - newTotalPaid);
        
        row.querySelector(".balance-due-cell").innerText = "$" + remainingBalance.toFixed(2);

        const statusCell = row.querySelector(".status-preview-cell");
        if (remainingBalance === 0) {
          statusCell.innerHTML = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">Fully Paid</span>';
        } else if (newTotalPaid > 0) {
          statusCell.innerHTML = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">Part Paid</span>';
        } else {
          statusCell.innerHTML = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800">Unpaid</span>';
        }
      });

      const display = document.getElementById("grandTotalPaymentDisplay");
      if (display) display.innerText = "$" + grandTotal.toFixed(2);
    }

    async function submitCustomAllocationPayment(e) {
      e.preventDefault();
      const payDate = document.getElementById("pay_date").value;
      const beneficiary = document.getElementById("pay_beneficiary").value;

      if (!globalData.ClearingInvoices) globalData.ClearingInvoices = [];
      if (!globalData.ClearingPayments) globalData.ClearingPayments = [];
      const allExtraCharges = globalData.ClearingExtraCharges || [];

      let grandTotalPaid = 0;
      let paidInvoiceIds = [];
      let updatedInvoicesList = [];
      const paymentId = "PAY-" + Date.now().toString().slice(-4);

      const rows = document.querySelectorAll("#customPaymentTable tbody tr");
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const invId = row.getAttribute("data-inv-id");
        const amtPayingNow = parseFloat(row.querySelector(".inv-pay-input").value) || 0;

        if (amtPayingNow <= 0) continue;

        const inv = globalData.ClearingInvoices.find(function(x) { return String(x.ID) === String(invId); });
        if (inv) {
          const fin = getInvoiceFinancials(inv, allExtraCharges);
          
          if (!Array.isArray(inv.PaymentRecords)) {
            inv.PaymentRecords = [];
            if (fin.alreadyPaid > 0) {
              inv.PaymentRecords.push({ paymentId: "INITIAL-PAY", amount: fin.alreadyPaid, date: payDate });
            }
          }

          inv.PaymentRecords.push({ paymentId: paymentId, amount: amtPayingNow, date: payDate });

          let newTotalPaid = 0;
          inv.PaymentRecords.forEach(function(pr) { newTotalPaid += parseFloat(pr.amount) || 0; });
          inv.PaidAmount = newTotalPaid;

          if (newTotalPaid >= fin.grandTotal) {
            inv.Status = "Fully Paid";
          } else if (newTotalPaid > 0) {
            inv.Status = "Part Paid";
          } else {
            inv.Status = "Unpaid";
          }

          grandTotalPaid += amtPayingNow;
          paidInvoiceIds.push(invId + " (Tx:" + paymentId + ")");
          updatedInvoicesList.push(inv);
        }
      }

      if (grandTotalPaid <= 0) {
        alert("Please enter a valid payment amount greater than $0.");
        return;
      }

      const newPayment = {
        ID: paymentId,
        Date: payDate,
        BeneficiaryName: beneficiary || "Agent/Transporter",
        AmountPaid: grandTotalPaid,
        InvoicesPaid: paidInvoiceIds.join(", ")
      };

      await sendToServer("ClearingPayments", "add", newPayment);
      for (const inv of updatedInvoicesList) {
        await sendToServer("ClearingInvoices", "update", inv);
      }

      closeInvoicePaymentModal();
      if (typeof showNotification === 'function') showNotification("Payment recorded successfully with Transaction ID: " + paymentId);
      if (currentActiveRecordId) previewClearingDetails(currentActiveRecordId);
      if (!document.getElementById("allPaymentsModal").classList.contains("hidden")) openAllPaymentsModal();
      if (!document.getElementById("allInvoicesModal").classList.contains("hidden")) openAllInvoicesModal();
    }

    async function submitInvoiceForm(e) {
      e.preventDefault();
      const editId = document.getElementById("inv_edit_id").value;
      const clearingId = document.getElementById("inv_clearingId").value;
      const invoiceType = document.getElementById("inv_type").value;
      
      const db = globalData || {};
      const clearingItem = (db.Clearing || []).find(function(x) { return String(x.ID) === String(clearingId); }) || selectedInvoiceClearingItem;

      if (!editId && clearingItem && clearingId) {
        const existingInvoices = (db.ClearingInvoices || []).filter(function(inv) {
          return String(inv.ClearingID) === String(clearingId) && String(inv.Type) === String(invoiceType);
        });
        if (existingInvoices.length > 0) {
          alert("A " + invoiceType + " invoice already exists for this container! You can edit the existing invoice or add extra charges directly to it.");
          return;
        }
      }

      const invoiceId = editId || ("INV-" + Date.now().toString().slice(-4));

      const activeCharges = [];
      document.querySelectorAll('#extra_charges_container .extra-charge-row').forEach(function(row) {
        const type = row.querySelector('.ec-type')?.value;
        const desc = row.querySelector('.ec-desc')?.value || '';
        const amt = parseFloat(row.querySelector('.ec-amt')?.value) || 0;
        if (type) {
          activeCharges.push({ type: type, description: desc, amount: amt });
        }
      });

      let existingPaymentRecords = [];
      if (editId) {
        const oldInv = (db.ClearingInvoices || []).find(function(x) { return String(x.ID) === String(editId); });
        if (oldInv && Array.isArray(oldInv.PaymentRecords)) {
          existingPaymentRecords = oldInv.PaymentRecords;
        }
      }

      const invoiceData = {
        ID: invoiceId,
        ClearingID: clearingItem ? clearingItem.ID : '',
        ContainerNo: clearingItem ? clearingItem.ContainerNo : '',
        Type: invoiceType,
        BeneficiaryName: document.getElementById("inv_beneficiary").value,
        Amount: parseFloat(document.getElementById("inv_amount").value) || 0,
        Status: document.getElementById("inv_status").value,
        PaymentRecords: existingPaymentRecords
      };

      if (!globalData.ClearingInvoices) globalData.ClearingInvoices = [];
      await sendToServer("ClearingInvoices", editId ? "update" : "add", invoiceData);

      if (!globalData.ClearingExtraCharges) globalData.ClearingExtraCharges = [];

      if (editId) {
        const existingCharges = globalData.ClearingExtraCharges.filter(function(c) { return String(c.InvoiceID) === String(editId); });
        for (const oldChg of existingCharges) {
          await sendToServer("ClearingExtraCharges", "delete", { ID: oldChg.ID });
        }
      }

      for (let i = 0; i < activeCharges.length; i++) {
        const chg = activeCharges[i];
        const newChargeRecord = {
          ID: "CHG-" + Date.now().toString().slice(-4) + "-" + i,
          ClearingID: clearingItem ? clearingItem.ID : '',
          InvoiceID: invoiceId,
          ContainerNo: clearingItem ? clearingItem.ContainerNo : '',
          Type: chg.type,
          Description: chg.description,
          Amount: chg.amount,
          Date: new Date().toISOString().split('T')[0]
        };
        await sendToServer("ClearingExtraCharges", "add", newChargeRecord);
      }

      if (typeof closeFormModal === 'function') closeFormModal();
      if (typeof showNotification === 'function') showNotification("Invoice and Extra Charges saved successfully!");
      if (currentActiveRecordId) previewClearingDetails(currentActiveRecordId);
      if (!document.getElementById("allInvoicesModal").classList.contains("hidden")) openAllInvoicesModal();
    }

    function filterAllInvoicesTable() {
      const query = (document.getElementById("allInvSearchInput")?.value || "").toLowerCase().trim();
      const statusFilter = (document.getElementById("allInvStatusFilter")?.value || "").toLowerCase();
      const typeFilter = (document.getElementById("allInvTypeFilter")?.value || "").toLowerCase();

      const tbody = document.getElementById("tbl_all_invoices_body");
      if (!tbody) return;
      const rows = tbody.getElementsByTagName("tr");

      let visibleTotalInvoiced = 0;
      let visibleTotalPaid = 0;
      let visibleTotalBalance = 0;
      let visibleCount = 0;

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (row.id === "noAllInvResultsRow") continue;

        const text = row.textContent.toLowerCase();
        const rowStatus = (row.getAttribute("data-status") || "").toLowerCase();
        const rowType = (row.getAttribute("data-type") || "").toLowerCase();
        const rowTotal = parseFloat(row.getAttribute("data-total")) || 0;
        const rowPaid = parseFloat(row.getAttribute("data-paid")) || 0;
        const rowBalance = parseFloat(row.getAttribute("data-balance")) || 0;

        const matchesSearch = !query || text.includes(query);
        const matchesStatus = !statusFilter || rowStatus.includes(statusFilter);
        const matchesType = !typeFilter || rowType === typeFilter;

        if (matchesSearch && matchesStatus && matchesType) {
          row.style.display = "";
          visibleTotalInvoiced += rowTotal;
          visibleTotalPaid += rowPaid;
          visibleTotalBalance += rowBalance;
          visibleCount++;
        } else {
          row.style.display = "none";
        }
      }

      document.getElementById("summaryInvTotal").innerText = "$" + visibleTotalInvoiced.toFixed(2);
      document.getElementById("summaryInvPaid").innerText = "$" + visibleTotalPaid.toFixed(2);
      document.getElementById("summaryInvBalance").innerText = "$" + visibleTotalBalance.toFixed(2);

      let noRow = document.getElementById("noAllInvResultsRow");
      if (visibleCount === 0) {
        if (!noRow) {
          noRow = document.createElement("tr");
          noRow.id = "noAllInvResultsRow";
          noRow.innerHTML = '<td colspan="11" class="p-4 text-center text-gray-400">No matching invoices found.</td>';
          tbody.appendChild(noRow);
        } else {
          noRow.style.display = "";
        }
      } else if (noRow) {
        noRow.style.display = "none";
      }
    }

    function exportAllInvoicesPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape');

      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("FleetDesk - Agent & Transporter Invoices Report", 14, 15);

      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text("Generated on: " + new Date().toLocaleString(), 14, 22);

      let rowsData = [];
      document.querySelectorAll("#tbl_all_invoices_body tr").forEach(function(row) {
        if (row.style.display !== "none" && row.id !== "noAllInvResultsRow") {
          const cols = row.querySelectorAll("td");
          if (cols.length >= 10) {
            rowsData.push([
              cols[1].innerText, // ID
              cols[2].innerText, // Container
              cols[3].innerText, // Type
              cols[4].innerText, // Beneficiary
              cols[5].innerText, // Total
              cols[6].innerText, // Paid
              cols[7].innerText, // Balance
              cols[9].innerText  // Status
            ]);
          }
        }
      });

      let startY = 28;
      if (typeof doc.autoTable === 'function') {
        doc.autoTable({
          startY: startY,
          head: [['Invoice ID', 'Container', 'Type', 'Beneficiary', 'Total ($)', 'Paid ($)', 'Balance ($)', 'Status']],
          body: rowsData,
          theme: 'grid',
          headStyles: { fillColor: [30, 58, 138] },
          styles: { fontSize: 9 }
        });
      } else {
        let y = startY + 10;
        rowsData.forEach(function(r) {
          doc.text(r.join(" | "), 14, y);
          y += 8;
        });
      }

      doc.save("Invoices_Report.pdf");
    }

    function exportAllInvoicesCSV() {
      let csvContent = "data:text/csv;charset=utf-8,Invoice ID,Container,Type,Beneficiary,Total ($),Paid ($),Balance ($),Status\n";
      
      document.querySelectorAll("#tbl_all_invoices_body tr").forEach(function(row) {
        if (row.style.display !== "none" && row.id !== "noAllInvResultsRow") {
          const cols = row.querySelectorAll("td");
          if (cols.length >= 10) {
            const rowData = [
              cols[1].innerText,
              cols[2].innerText,
              cols[3].innerText,
              '"' + cols[4].innerText + '"',
              cols[5].innerText.replace('$', ''),
              cols[6].innerText.replace('$', ''),
              cols[7].innerText.replace('$', ''),
              cols[9].innerText
            ];
            csvContent += rowData.join(",") + "\n";
          }
        }
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "Invoices_Report.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
