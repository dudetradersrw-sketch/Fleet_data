<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Monitoring & Alerts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <h1 class="text-xl font-bold text-gray-800">Fleet Monitoring & Alerts</h1>
      <div id="headerCenterBadge"></div>

<button id="sync_btn" onclick="triggerSyncWithLoading()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition flex items-center gap-1.5">
  <span id="sync_icon">🔄</span> <span id="sync_text">Sync Data</span>
</button>

    </header>
    <div class="p-6 space-y-6" id="pageContent">Loading...</div>
  </main>

  <!-- Document Viewer Modal -->
  <div id="docViewerModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-4xl h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
      <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
        <h3 id="docViewerTitle" class="font-bold text-gray-800 text-lg truncate">Document Viewer</h3>
        <button onclick="closeDocViewer()" class="p-1.5 text-gray-500 hover:text-gray-800 hover:bg-gray-200 rounded-lg font-bold text-sm transition">✕ Close</button>
      </div>
      <div class="flex-1 bg-gray-100 p-2 flex items-center justify-center overflow-hidden">
        <iframe id="docViewerFrame" class="w-full h-full bg-white rounded-lg border shadow-inner" frameborder="0"></iframe>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("sidebarContainer").innerHTML = renderSidebar("Monitoring & Alerts");
    document.getElementById("headerCenterBadge").innerHTML = renderUserHeaderBadge();

    let currentTab = 'insurance'; // 'insurance', 'inspections', 'service'
    let searchQuery = ''; // Global search query state

    window.onDataLoaded = function(db) {
      renderMonitoringPage();
    };

    function switchMonitoringTab(tab) {
      currentTab = tab;
      searchQuery = ''; // Reset search when switching tabs
      renderMonitoringPage();
    }

    function handleSearchInput(e) {
      searchQuery = e.target.value.toLowerCase().trim();
      renderMonitoringPageContentOnly();
    }

    function renderMonitoringPage() {
      const db = globalData || {};
      const trucks = db.Trucks || [];
      const trailers = db.Trailers || [];
      const garage = db.Garage || [];
      const trips = db.Trips || [];
      const combinations = db.Combinations || [];

      const fleetItems = [
        ...trucks.map(t => ({ ...t, FleetType: 'Truck', Plate: t.PlateNumber || t.Registration || t.ID })),
        ...trailers.map(tr => ({ ...tr, FleetType: 'Trailer', Plate: tr.PlateNumber || tr.Registration || tr.ID }))
      ];

      let contentHtml = `
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
          <div class="flex gap-2 bg-gray-200 p-1 rounded-xl">
            <button onclick="switchMonitoringTab('insurance')" class="px-4 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'insurance' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}">🛡️ Insurance Tracking</button>
            <button onclick="switchMonitoringTab('inspections')" class="px-4 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'inspections' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}">📋 Vehicle Inspections</button>
            <button onclick="switchMonitoringTab('service')" class="px-4 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'service' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}">🔧 Engine Service & Trip Threshold</button>
          </div>

          <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="relative flex-1 md:w-72">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
              <input type="text" id="searchInput" value="${searchQuery}" oninput="handleSearchInput(event)" placeholder="Search by plate, make, model..." class="w-full pl-9 pr-4 py-2 bg-white border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-500 shadow-sm transition">
            </div>

            ${currentTab !== 'service' ? `
              <button onclick="openRecordModal('${currentTab}')" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2 whitespace-nowrap">
                ➕ Add ${currentTab === 'insurance' ? 'Insurance' : 'Inspection'}
              </button>
            ` : ''}
          </div>
        </div>

        <div id="tableContainer">
          ${renderActiveTable(fleetItems, trucks, garage, trips, combinations)}
        </div>
      `;

      document.getElementById("pageContent").innerHTML = contentHtml;
      
      const input = document.getElementById("searchInput");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function renderMonitoringPageContentOnly() {
      const db = globalData || {};
      const trucks = db.Trucks || [];
      const trailers = db.Trailers || [];
      const garage = db.Garage || [];
      const trips = db.Trips || [];
      const combinations = db.Combinations || [];

      const fleetItems = [
        ...trucks.map(t => ({ ...t, FleetType: 'Truck', Plate: t.PlateNumber || t.Registration || t.ID })),
        ...trailers.map(tr => ({ ...tr, FleetType: 'Trailer', Plate: tr.PlateNumber || tr.Registration || tr.ID }))
      ];

      const container = document.getElementById("tableContainer");
      if (container) {
        container.innerHTML = renderActiveTable(fleetItems, trucks, garage, trips, combinations);
      }
    }

    function renderActiveTable(fleetItems, trucks, garage, trips, combinations) {
      if (currentTab === 'insurance') {
        return renderInsuranceTable(fleetItems);
      } else if (currentTab === 'inspections') {
        return renderInspectionsTable(fleetItems);
      } else {
        return renderServiceTable(trucks, garage, trips, combinations);
      }
    }

    // 1. Insurance Tracking View with Search Filtering
    function renderInsuranceTable(fleetItems) {
      const filtered = fleetItems.filter(item => {
        const plate = String(item.Plate || '').toLowerCase();
        const makeModel = `${item.Make || item.Brand || ''} ${item.Model || item.Type || ''}`.toLowerCase();
        const type = String(item.FleetType || '').toLowerCase();
        return plate.includes(searchQuery) || makeModel.includes(searchQuery) || type.includes(searchQuery);
      });

      let rows = "";
      filtered.forEach(item => {
        const hasInsurance = item.InsuranceStart || item.InsuranceExpiry;
        const makeModel = `${item.Make || item.Brand || ''} ${item.Model || item.Type || ''}`.trim() || 'N/A';
        const attachments = parseAttachments(item.InsuranceAttachments);

        rows += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3 font-semibold text-gray-800">${item.Plate} <span class="text-[11px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded ml-1">${item.FleetType}</span></td>
            <td class="p-3 text-gray-600">${makeModel}</td>
            <td class="p-3 text-gray-600">${item.InsuranceStart || '<span class="text-gray-400 italic">Not Recorded</span>'}</td>
            <td class="p-3 font-semibold ${isExpired(item.InsuranceExpiry) ? 'text-red-600' : 'text-green-600'}">${item.InsuranceExpiry || '<span class="text-gray-400 italic">Not Recorded</span>'}</td>
            <td class="p-3 text-center">
              ${hasInsurance ? `
                <span class="px-2 py-1 rounded text-xs font-semibold ${isExpired(item.InsuranceExpiry) ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">
                  ${isExpired(item.InsuranceExpiry) ? 'Expired' : 'Active'}
                </span>
              ` : '<span class="text-xs text-gray-400">No Record</span>'}
            </td>
            <td class="p-3 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button onclick="openRecordModal('insurance', '${item.ID}', '${item.FleetType}')" title="Edit Record" class="p-1.5 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded-lg text-xs transition">✏️</button>
                <button onclick="openFileUploadModal('insurance', '${item.ID}', '${item.FleetType}', '${item.Plate}')" title="Attach Document Files" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded text-xs font-semibold hover:bg-emerald-200 transition">📎 (${attachments.length})</button>
                <button onclick="clearRecord('insurance', '${item.ID}', '${item.FleetType}')" title="Delete Record" class="p-1.5 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg text-xs transition">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      });

      return `
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden mt-4">
          <div class="p-4 border-b font-bold text-gray-700">Insurance Start & Expiry Monitoring (Trucks & Trailers)</div>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="bg-gray-50 text-gray-500">
                <th class="p-3">Plate Number / Type</th>
                <th class="p-3">Make / Model</th>
                <th class="p-3">Start Date</th>
                <th class="p-3">Expiry Date</th>
                <th class="p-3 text-center">Status</th>
                <th class="p-3 text-center">Actions</th>
              </tr>
            </thead>
            <tbody>${rows || '<tr><td colspan="6" class="p-4 text-center text-gray-400">No matching insurance records found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }

    // 2. Vehicle Inspections View with Search Filtering
    function renderInspectionsTable(fleetItems) {
      const filtered = fleetItems.filter(item => {
        const plate = String(item.Plate || '').toLowerCase();
        const makeModel = `${item.Make || item.Brand || ''} ${item.Model || item.Type || ''}`.toLowerCase();
        const type = String(item.FleetType || '').toLowerCase();
        return plate.includes(searchQuery) || makeModel.includes(searchQuery) || type.includes(searchQuery);
      });

      let rows = "";
      filtered.forEach(item => {
        const hasInspection = item.InspectionStart || item.InspectionExpiry;
        const makeModel = `${item.Make || item.Brand || ''} ${item.Model || item.Type || ''}`.trim() || 'N/A';
        const attachments = parseAttachments(item.InspectionAttachments);

        rows += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3 font-semibold text-gray-800">${item.Plate} <span class="text-[11px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded ml-1">${item.FleetType}</span></td>
            <td class="p-3 text-gray-600">${makeModel}</td>
            <td class="p-3 text-gray-600">${item.InspectionStart || '<span class="text-gray-400 italic">Not Recorded</span>'}</td>
            <td class="p-3 font-semibold ${isExpired(item.InspectionExpiry) ? 'text-red-600' : 'text-green-600'}">${item.InspectionExpiry || '<span class="text-gray-400 italic">Not Recorded</span>'}</td>
            <td class="p-3 text-center">
              ${hasInspection ? `
                <span class="px-2 py-1 rounded text-xs font-semibold ${isExpired(item.InspectionExpiry) ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">
                  ${isExpired(item.InspectionExpiry) ? 'Expired' : 'Active'}
                </span>
              ` : '<span class="text-xs text-gray-400">No Record</span>'}
            </td>
            <td class="p-3 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button onclick="openRecordModal('inspection', '${item.ID}', '${item.FleetType}')" title="Edit Record" class="p-1.5 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded-lg text-xs transition">✏️</button>
                <button onclick="openFileUploadModal('inspection', '${item.ID}', '${item.FleetType}', '${item.Plate}')" title="Attach Document Files" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded text-xs font-semibold hover:bg-emerald-200 transition">📎 (${attachments.length})</button>
                <button onclick="clearRecord('inspection', '${item.ID}', '${item.FleetType}')" title="Delete Record" class="p-1.5 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg text-xs transition">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      });

      return `
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden mt-4">
          <div class="p-4 border-b font-bold text-gray-700">Vehicle Inspection Start & Expiry Monitoring (Trucks & Trailers)</div>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="bg-gray-50 text-gray-500">
                <th class="p-3">Plate Number / Type</th>
                <th class="p-3">Make / Model</th>
                <th class="p-3">Inspection Start</th>
                <th class="p-3">Inspection Expiry</th>
                <th class="p-3 text-center">Status</th>
                <th class="p-3 text-center">Actions</th>
              </tr>
            </thead>
            <tbody>${rows || '<tr><td colspan="6" class="p-4 text-center text-gray-400">No matching inspection records found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }

    // 3. Engine Service & Trip Threshold Tracking with Search Filtering
    function renderServiceTable(trucks, garage, trips, combinations) {
      const filteredTrucks = trucks.filter(truck => {
        const plate = String(truck.PlateNumber || truck.Registration || '').toLowerCase();
        const makeModel = `${truck.Make || ''} ${truck.Model || ''}`.toLowerCase();
        return plate.includes(searchQuery) || makeModel.includes(searchQuery);
      });

      let rows = "";

      filteredTrucks.forEach(truck => {
        const truckPlate = String(truck.PlateNumber || truck.Registration || '').trim();
        const truckId = String(truck.ID || truck.PlateNumber).trim();
        const makeModel = `${truck.Make || ''} ${truck.Model || ''}`.trim() || 'N/A';

        const truckCombIds = combinations
          .filter(c => String(c.TruckID) === truckId || String(c.TruckID) === truckPlate || String(c.Truck) === truckPlate)
          .map(c => String(c.ID));

        const truckTrips = trips.filter(t => {
          const matchesComb = truckCombIds.includes(String(t.CombinationID));
          const matchesTruckDirect = String(t.TruckID) === truckId || String(t.TruckID) === truckPlate;
          const tripCombo = combinations.find(c => String(c.ID) === String(t.CombinationID));
          const matchesTripComboTruck = tripCombo && (String(tripCombo.TruckID) === truckId || String(tripCombo.TruckID) === truckPlate);
          return matchesComb || matchesTruckDirect || matchesTripComboTruck;
        });

        truckTrips.sort((a, b) => new Date(a.StartDate || a.Date || 0) - new Date(b.StartDate || b.Date || 0));

        const engineServices = garage.filter(g => {
          const matchTruckRef = String(g.TruckID) === truckId || String(g.TruckID) === truckPlate || truckCombIds.includes(String(g.TruckID));
          const desc = String(g.Item || g.Description || g.ServiceType || g.Service || '').toLowerCase();
          return matchTruckRef && (desc.includes('engine') || desc.includes('service') || desc.includes('oil'));
        });

        engineServices.sort((a, b) => new Date(b.Date || 0) - new Date(a.Date || 0));
        const lastService = engineServices.length > 0 ? engineServices[0] : null;

        let lastServiceDate = lastService && lastService.Date ? String(lastService.Date).split('T')[0] : 'No Record';

        let subsequentTripsCount = 0;
        if (lastService) {
          if (lastService.TripID) {
            const serviceTripIndex = truckTrips.findIndex(t => String(t.ID) === String(lastService.TripID) || String(t.TripNumber) === String(lastService.TripID));
            if (serviceTripIndex !== -1) {
              subsequentTripsCount = truckTrips.length - 1 - serviceTripIndex;
              if (subsequentTripsCount < 0) subsequentTripsCount = 0;
            } else {
              subsequentTripsCount = truckTrips.length;
            }
          } else if (lastService.Date) {
            const serviceDate = new Date(lastService.Date);
            subsequentTripsCount = truckTrips.filter(t => new Date(t.StartDate || t.Date || 0) > serviceDate).length;
          } else {
            subsequentTripsCount = truckTrips.length;
          }
        } else {
          subsequentTripsCount = truckTrips.length;
        }

        const needsService = subsequentTripsCount >= 3 || !lastService;
        const rowBg = needsService ? 'bg-red-50 hover:bg-red-100 border-l-4 border-red-500' : 'hover:bg-gray-50';

        rows += `
          <tr class="border-b ${rowBg} cursor-pointer transition" onclick="showEngineServiceHistory('${truckId}', '${truckPlate}')" title="Click to view engine service history">
            <td class="p-3 font-semibold text-gray-800">🚛 ${truckPlate || truckId}</td>
            <td class="p-3 text-gray-600">${makeModel}</td>
            <td class="p-3 font-medium text-indigo-700">${lastServiceDate}</td>
            <td class="p-3 text-center font-bold ${subsequentTripsCount >= 3 ? 'text-red-600' : 'text-gray-700'}">${subsequentTripsCount} / 3 Trips</td>
            <td class="p-3 text-center">
              ${needsService ? `
                <span class="bg-red-100 text-red-800 px-2.5 py-1 rounded text-xs font-bold animate-pulse">
                  ⚠️ EngineService needed!
                </span>
              ` : `
                <span class="bg-green-100 text-green-800 px-2.5 py-1 rounded text-xs font-semibold">
                  Up to Date
                </span>
              `}
            </td>
          </tr>
        `;
      });

      return `
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden mt-4">
          <div class="p-4 border-b flex justify-between items-center bg-gray-50">
            <div>
              <span class="font-bold text-gray-700">Engine Service & Trip Threshold Tracking (Threshold: 3 Trips)</span>
              <p class="text-xs text-gray-500 mt-0.5">Click any truck row to inspect full historical engine service records.</p>
            </div>
          </div>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="bg-gray-50 text-gray-500 text-xs">
                <th class="p-3">Truck Plate</th>
                <th class="p-3">Make / Model</th>
                <th class="p-3">Last Engine Service Date</th>
                <th class="p-3 text-center">Subsequent Trips</th>
                <th class="p-3 text-center">Notification Status</th>
              </tr>
            </thead>
            <tbody>${rows || '<tr><td colspan="5" class="p-4 text-center text-gray-400">No matching trucks found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }

    // Historical Engine Service Modal
    function showEngineServiceHistory(truckId, truckPlate) {
      const db = globalData || {};
      const garage = db.Garage || [];
      const combinations = db.Combinations || [];

      const truckCombIds = combinations
        .filter(c => String(c.TruckID) === String(truckId) || String(c.TruckID) === String(truckPlate))
        .map(c => String(c.ID));

      const truckServices = garage.filter(g => {
        const matchTruckRef = String(g.TruckID) === String(truckId) || String(g.TruckID) === String(truckPlate) || truckCombIds.includes(String(g.TruckID));
        const desc = String(g.Item || g.Description || g.ServiceType || g.Service || '').toLowerCase();
        return matchTruckRef && (desc.includes('engine') || desc.includes('service') || desc.includes('oil'));
      });

      truckServices.sort((a, b) => new Date(b.Date || 0) - new Date(a.Date || 0));

      let historyRows = "";
      truckServices.forEach(s => {
        const sDate = s.Date ? String(s.Date).split('T')[0] : 'N/A';
        historyRows += `
          <tr class="border-b">
            <td class="p-2.5 font-medium">${sDate}</td>
            <td class="p-2.5 font-semibold text-gray-800">${s.Item || s.Description || 'Engine Service'}</td>
            <td class="p-2.5 font-bold text-red-600">$${s.TotalUSD || s.PriceUSD || 0}</td>
            <td class="p-2.5 text-gray-600 text-xs">${s.ShopRef || s.Comment || 'N/A'}</td>
          </tr>
        `;
      });

      const modalHtml = `
        <div class="space-y-3">
          <p class="text-xs text-gray-500">Full historical log of engine services recorded for truck: <span class="font-bold text-gray-800">${truckPlate}</span></p>
          <div class="overflow-x-auto max-h-[350px]">
            <table class="w-full text-xs border">
              <thead>
                <tr class="bg-gray-100 text-gray-600">
                  <th class="p-2.5">Date</th>
                  <th class="p-2.5">Item / Service</th>
                  <th class="p-2.5">Cost (USD)</th>
                  <th class="p-2.5">Shop Ref / Remarks</th>
                </tr>
              </thead>
              <tbody>${historyRows || '<tr><td colspan="4" class="p-4 text-center text-gray-400 italic">No historical engine service records found for this truck.</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById("modalTitle").innerText = `Engine Service History: ${truckPlate}`;
      document.getElementById("modalBody").innerHTML = modalHtml;
      document.getElementById("previewModal").classList.remove("hidden");
    }

    // Modal Form for Record Creation / Editing
    function openRecordModal(type, selectedId = null, fleetType = 'Truck') {
      const db = globalData || {};
      const items = fleetType === 'Trailer' ? (db.Trailers || []) : (db.Trucks || []);
      const selectedItem = selectedId ? items.find(i => String(i.ID) === String(selectedId)) : null;

      const title = type === 'insurance' 
        ? (selectedItem ? `Edit Insurance: ${selectedItem.PlateNumber || selectedItem.Registration}` : 'Add Insurance Record')
        : (selectedItem ? `Edit Inspection: ${selectedItem.PlateNumber || selectedItem.Registration}` : 'Add Inspection Record');

      let startVal = selectedItem 
        ? (type === 'insurance' ? selectedItem.InsuranceStart : selectedItem.InspectionStart) || '' 
        : '';
      let expiryVal = selectedItem 
        ? (type === 'insurance' ? selectedItem.InsuranceExpiry : selectedItem.InspectionExpiry) || '' 
        : '';

      const optionsHtml = [
        ...db.Trucks.map(t => `<option value="Truck_${t.ID}" ${selectedItem && String(selectedItem.ID) === String(t.ID) && fleetType === 'Truck' ? 'selected' : ''}>[Truck] ${t.PlateNumber || t.Registration}</option>`),
        ...db.Trailers.map(tr => `<option value="Trailer_${tr.ID}" ${selectedItem && String(selectedItem.ID) === String(tr.ID) && fleetType === 'Trailer' ? 'selected' : ''}>[Trailer] ${tr.PlateNumber || tr.Registration}</option>`)
      ].join('');

      const html = `
        <form onsubmit="submitRecordForm(event, '${type}')" class="space-y-4">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Select Fleet Vehicle / Trailer</label>
            <select id="rec_fleet_key" ${selectedItem ? 'disabled' : ''} class="border p-2 rounded w-full text-sm outline-none bg-white">
              ${optionsHtml || '<option value="">No vehicles available</option>'}
            </select>
            ${selectedItem ? `<input type="hidden" id="rec_fleet_key_hidden" value="${fleetType}_${selectedItem.ID}">` : ''}
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Start Date</label>
            <input type="date" id="rec_start" value="${startVal}" required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">Expiry Date</label>
            <input type="date" id="rec_expiry" value="${expiryVal}" required class="border p-2 rounded w-full text-sm outline-none">
          </div>

          <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">
            Save ${type === 'insurance' ? 'Insurance' : 'Inspection'} Record
          </button>
        </form>
      `;

      openFormModal(title, html);
    }

    async function submitRecordForm(e, type) {
      e.preventDefault();
      const keyVal = document.getElementById("rec_fleet_key_hidden") 
        ? document.getElementById("rec_fleet_key_hidden").value 
        : document.getElementById("rec_fleet_key").value;

      if (!keyVal) return;
      const [fType, fId] = keyVal.split('_');

      const db = globalData || {};
      const list = fType === 'Trailer' ? db.Trailers : db.Trucks;
      const targetItem = list.find(i => String(i.ID) === String(fId));
      if (!targetItem) return;

      const startDate = document.getElementById("rec_start").value;
      const expiryDate = document.getElementById("rec_expiry").value;

      if (type === 'insurance') {
        targetItem.InsuranceStart = startDate;
        targetItem.InsuranceExpiry = expiryDate;
      } else {
        targetItem.InspectionStart = startDate;
        targetItem.InspectionExpiry = expiryDate;
      }

      await sendToServer(fType === 'Trailer' ? 'Trailers' : 'Trucks', "update", targetItem);
      if (typeof closeFormModal === 'function') closeFormModal();
      if (typeof fetchDatabase === 'function') fetchDatabase(true);
    }

    async function clearRecord(type, id, fType) {
      if (confirm(`Are you sure you want to delete this ${type} record?`)) {
        const db = globalData || {};
        const list = fType === 'Trailer' ? db.Trailers : db.Trucks;
        const targetItem = list.find(i => String(i.ID) === String(id));
        if (!targetItem) return;

        if (type === 'insurance') {
          targetItem.InsuranceStart = "";
          targetItem.InsuranceExpiry = "";
          targetItem.InsuranceAttachments = "";
        } else {
          targetItem.InspectionStart = "";
          targetItem.InspectionExpiry = "";
          targetItem.InspectionAttachments = "";
        }

        await sendToServer(fType === 'Trailer' ? 'Trailers' : 'Trucks', "update", targetItem);
      }
    }

    // --- Attachment & In-App Viewing Functions ---
    function parseAttachments(fieldVal) {
      if (!fieldVal) return [];
      if (typeof fieldVal === 'string') {
        try {
          const parsed = JSON.parse(fieldVal);
          if (Array.isArray(parsed)) return parsed;
        } catch (e) {
          return [{ name: fieldVal.split('/').pop().split('?')[0] || 'Document', url: fieldVal }];
        }
      }
      if (Array.isArray(fieldVal)) return fieldVal;
      return [];
    }

    function openFileUploadModal(type, id, fleetType, plate) {
      const db = globalData || {};
      const list = fleetType === 'Trailer' ? db.Trailers : db.Trucks;
      const targetItem = list.find(i => String(i.ID) === String(id));
      if (!targetItem) return;

      const attachments = parseAttachments(type === 'insurance' ? targetItem.InsuranceAttachments : targetItem.InspectionAttachments);

      let listHtml = "";
      if (attachments.length === 0) {
        listHtml = `<p class="text-xs text-gray-400 italic py-2 text-center">No files attached yet.</p>`;
      } else {
        attachments.forEach((att, idx) => {
          listHtml += `
            <div class="flex items-center justify-between bg-gray-50 p-2 rounded border text-xs">
              <span class="truncate font-medium text-gray-700 max-w-[200px]" title="${att.name}">📄 ${att.name}</span>
              <div class="flex items-center gap-1.5">
                <button type="button" onclick="viewAttachedFileInApp('${att.url}', '${att.name}')" class="px-2 py-1 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200 font-semibold">👁️ View</button>
                <button type="button" onclick="removeAttachmentFromModal('${type}', '${id}', '${fleetType}', ${idx})" class="px-2 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 font-semibold">✕ Remove</button>
              </div>
            </div>
          `;
        });
      }

      const modalTitle = `Manage Attachments (${type === 'insurance' ? 'Insurance' : 'Inspection'}): ${plate}`;
      const html = `
        <div class="space-y-4">
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-2">Attached Files List:</label>
            <div class="space-y-2 max-h-48 overflow-y-auto pr-1 border rounded-lg p-2 bg-white">
              ${listHtml}
            </div>
          </div>
          <hr class="my-2">
          <form onsubmit="handleMultipleFileUpload(event, '${type}', '${id}', '${fleetType}')" class="space-y-3">
            <div>
              <label class="text-xs font-bold text-gray-600 block mb-1">Upload New Files (PDF, PNG, JPG)</label>
              <input type="file" id="multiple_file_input" accept=".pdf,image/*" multiple required class="border p-2 rounded w-full text-sm bg-white outline-none">
            </div>
            <button type="submit" id="upload_submit_btn" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition">
              Upload & Attach Files
            </button>
          </form>
        </div>
      `;
      openFormModal(modalTitle, html);
    }

    async function handleMultipleFileUpload(e, type, id, fleetType) {
      e.preventDefault();
      const fileInput = document.getElementById("multiple_file_input");
      const submitBtn = document.getElementById("upload_submit_btn");

      if (!fileInput.files || fileInput.files.length === 0) return;

      submitBtn.disabled = true;
      submitBtn.innerText = "Processing Files...";

      const db = globalData || {};
      const list = fleetType === 'Trailer' ? db.Trailers : db.Trucks;
      const targetItem = list.find(i => String(i.ID) === String(id));
      if (!targetItem) return;

      const existingAttachments = parseAttachments(type === 'insurance' ? targetItem.InsuranceAttachments : targetItem.InspectionAttachments);
      const newAttachments = [...existingAttachments];

      for (let i = 0; i < fileInput.files.length; i++) {
        const file = fileInput.files[i];
        const base64Url = await convertFileToBase64(file);
        newAttachments.push({
          name: file.name,
          url: base64Url,
          size: file.size,
          type: file.type
        });
      }

      if (type === 'insurance') {
        targetItem.InsuranceAttachments = JSON.stringify(newAttachments);
      } else {
        targetItem.InspectionAttachments = JSON.stringify(newAttachments);
      }

      await sendToServer(fleetType === 'Trailer' ? 'Trailers' : 'Trucks', "update", targetItem);
      if (typeof closeFormModal === 'function') closeFormModal();
      if (typeof renderMonitoringPage === 'function') renderMonitoringPage();
    }

    async function removeAttachmentFromModal(type, id, fleetType, index) {
      const db = globalData || {};
      const list = fleetType === 'Trailer' ? db.Trailers : db.Trucks;
      const targetItem = list.find(i => String(i.ID) === String(id));
      if (!targetItem) return;

      const attachments = parseAttachments(type === 'insurance' ? targetItem.InsuranceAttachments : targetItem.InspectionAttachments);
      attachments.splice(index, 1);

      if (type === 'insurance') {
        targetItem.InsuranceAttachments = JSON.stringify(attachments);
      } else {
        targetItem.InspectionAttachments = JSON.stringify(attachments);
      }

      await sendToServer(fleetType === 'Trailer' ? 'Trailers' : 'Trucks', "update", targetItem);
      openFileUploadModal(type, id, fleetType, targetItem.PlateNumber || targetItem.Registration || targetItem.ID);
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function viewAttachedFileInApp(url, fileName) {
      if (!url) {
        alert("No document URL attached.");
        return;
      }
      document.getElementById("docViewerTitle").innerText = fileName || "Document Viewer";
      document.getElementById("docViewerFrame").src = url;
      document.getElementById("docViewerModal").classList.remove("hidden");
    }

    function closeDocViewer() {
      document.getElementById("docViewerModal").classList.add("hidden");
      document.getElementById("docViewerFrame").src = "";
    }

    function isExpired(dateString) {
      if (!dateString) return false;
      const expiry = new Date(dateString);
      const today = new Date();
      return expiry < today;
    }

    fetchDatabase();
  </script>
</body>
</html>
