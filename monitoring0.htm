<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Monitoring & Alerts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <h1 class="text-xl font-bold text-gray-800">Monitoring & Compliance Alerts</h1>
      <button onclick="fetchDatabase()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm">🔄 Sync Data</button>
    </header>
    <div class="p-6 space-y-6" id="pageContent">Loading...</div>
  </main>
  <script>
    document.getElementById("sidebarContainer").innerHTML = renderSidebar("Monitoring & Alerts");

    window.onDataLoaded = function(db) {
      const truckOptions = (db.Trucks || []).map(t => `<option value="${t.ID}">${t.PlateNumber}</option>`).join('');
      const monitoringList = db.Monitoring || [];

      document.getElementById("pageContent").innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="font-semibold text-gray-700 mb-4">Add Insurance & Inspection Compliance</h3>
          <form onsubmit="submitMonitoring(event)" class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <select id="m_target" required class="border p-2 rounded"><option value="">Select Truck</option>${truckOptions}</select>
            <input type="text" id="m_comp" placeholder="Insurance Company" required class="border p-2 rounded">
            <div><label class="text-xs text-gray-500 block">Insurance From</label><input type="date" id="m_from" required class="border p-2 rounded w-full"></div>
            <div><label class="text-xs text-gray-500 block">Insurance To</label><input type="date" id="m_to" required class="border p-2 rounded w-full"></div>
            <div><label class="text-xs text-gray-500 block">Inspection To</label><input type="date" id="m_insp" required class="border p-2 rounded w-full"></div>
            <button type="submit" class="md:col-span-5 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Save Compliance Record</button>
          </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
          <div class="p-4 border-b flex justify-between items-center">
            <input type="text" placeholder="🔍 Search monitoring records..." oninput="filterTable(event, 'table_Monitoring')" class="border px-3 py-1.5 rounded text-sm w-72 outline-none">
            <div class="flex gap-2">
              <button onclick="exportPDFTable('Monitoring', globalData.Monitoring)" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm">📥 PDF Export</button>
              <button onclick="exportCSVData('Monitoring', globalData.Monitoring)" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm">📥 CSV Export</button>
            </div>
          </div>
          <table class="w-full text-left border-collapse text-sm" id="table_Monitoring">
            <thead>
              <tr class="bg-gray-50 text-gray-500">
                <th class="p-3">ID</th><th class="p-3">Truck ID</th><th class="p-3">Insurance Co</th><th class="p-3">Insurance To</th><th class="p-3">Inspection To</th><th class="p-3 text-center">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              ${monitoringList.map(m => {
                const today = new Date();
                const insTo = new Date(m.InsuranceTo);
                const diffDays = Math.ceil((insTo - today) / (1000 * 60 * 60 * 24));
                
                let rowBg = "";
                let badge = `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs">Valid</span>`;
                if (diffDays <= 0) {
                  rowBg = "bg-red-100 text-red-900 font-medium";
                  badge = `<span class="bg-red-600 text-white px-2 py-0.5 rounded text-xs">EXPIRED (RED)</span>`;
                } else if (diffDays <= 15) {
                  rowBg = "bg-yellow-100 text-yellow-900 font-medium";
                  badge = `<span class="bg-yellow-500 text-white px-2 py-0.5 rounded text-xs">Expires in ${diffDays}d (YELLOW)</span>`;
                }

                return `
                  <tr class="${rowBg}">
                    <td class="p-3">${m.ID}</td>
                    <td class="p-3 font-semibold">${m.TargetID}</td>
                    <td class="p-3">${m.InsuranceCompany}</td>
                    <td class="p-3">${m.InsuranceTo}${badge}</td>
                    <td class="p-3">${m.InspectionTo}</td>
                    <td class="p-3 text-center space-x-1">
                      <button onclick="deleteRecord('Monitoring', '${m.ID}')" class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs">🗑️ Delete</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    };

    async function submitMonitoring(e) {
      e.preventDefault();
      const data = {
        TargetID: document.getElementById("m_target").value,
        InsuranceCompany: document.getElementById("m_comp").value,
        InsuranceFrom: document.getElementById("m_from").value,
        InsuranceTo: document.getElementById("m_to").value,
        InspectionTo: document.getElementById("m_insp").value
      };
      await sendToServer("Monitoring", "add", data);
    }

    fetchDatabase();
  </script>
</body>
</html>
