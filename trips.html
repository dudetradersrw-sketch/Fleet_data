<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetDesk - Trips & Spendings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
  <div id="sidebarContainer"></div>
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <h1 class="text-xl font-bold text-gray-800">Trips & Spending Control</h1>
      <button onclick="fetchDatabase(true)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition">🔄 Sync Data</button>
    </header>
    <div class="p-6 space-y-6" id="pageContent">Loading...</div>
  </main>

  <script>
    document.getElementById("sidebarContainer").innerHTML = renderSidebar("Trips");

    window.onDataLoaded = function(db) {
      db = db || {};
      const trips = db.Trips || [];
      const combinations = db.Combinations || [];
      const trucks = db.Trucks || [];
      const trailers = db.Trailers || [];
      const drivers = db.Drivers || [];
      const garageList = db.Garage || [];

      const columns = ["ID", "Trip Number", "Vehicle (Combination)", "Driver", "Start Date", "Total Spend (USD)", "Status", "Actions"];

      let tableRows = "";
      trips.forEach(trip => {
        const combination = combinations.find(c => String(c.ID) === String(trip.CombinationID));
        let displayVehicle = trip.CombinationID || 'N/A';
        if (combination) {
          const t = trucks.find(tr => String(tr.ID) === String(combination.TruckID) || String(tr.PlateNumber) === String(combination.TruckID));
          const tr = trailers.find(trl => String(trl.ID) === String(combination.TrailerID) || String(trl.PlateNumber) === String(combination.TrailerID));
          const tPlate = t ? (t.PlateNumber || t.Registration || t.ID) : combination.TruckID;
          const trPlate = tr ? (tr.PlateNumber || tr.Registration || tr.ID) : 'No Trailer';
          displayVehicle = tPlate + '/' + trPlate;
        }

        const driver = drivers.find(d => String(d.ID) === String(trip.DriverID));
        const driverName = driver ? (driver.FullName || driver.Name || driver.ID) : (trip.DriverID || 'N/A');

        const tripGarageSpend = garageList
          .filter(g => String(g.TripID) === String(trip.ID) || String(g.TripID) === String(trip.TripNumber))
          .reduce((sum, g) => sum + (parseFloat(g.TotalUSD || g.PriceUSD) || 0), 0);

        tableRows += `
          <tr class="hover:bg-gray-50 border-b cursor-pointer" onclick="previewTripDetails('${trip.ID}')">
            <td class="p-3 text-xs text-gray-500 font-mono">${trip.ID || ''}</td>
            <td class="p-3 font-semibold text-gray-800">🚀 ${trip.TripNumber || ''}</td>
            <td class="p-3 font-semibold text-indigo-700">🚛 ${displayVehicle}</td>
            <td class="p-3 font-medium text-blue-600">👤 ${driverName}</td>
            <td class="p-3 text-xs">${trip.StartDate || 'N/A'}</td>
            <td class="p-3 font-bold text-red-600">$${tripGarageSpend.toFixed(2)}</td>
            <td class="p-3"><span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-xs font-medium">${trip.Status || 'Active'}</span></td>
            <td class="p-3 text-center" onclick="event.stopPropagation()">
              ${renderActionCell('Trips', trip.ID)}
            </td>
          </tr>
        `;
      });

      document.getElementById("pageContent").innerHTML = `
        <div class="mb-2 flex justify-between items-center">
          <button onclick="openTripFormModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg shadow transition">
            ➕ Start New Trip
          </button>
        </div>
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
          <div class="p-4 border-b flex flex-col md:flex-row justify-between items-center gap-3">
            <input type="text" placeholder="🔍 Search trips..." oninput="filterTable(event, 'table_Trips')" class="border px-3 py-1.5 rounded text-sm w-full md:w-72 outline-none">
            <div class="flex items-center gap-2">
              ${renderColumnVisibilityMenu('table_Trips', columns)}
              <button onclick="exportPDFTable('Trips', globalData.Trips || [])" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm font-semibold">📥 PDF</button>
              <button onclick="exportCSVData('Trips', globalData.Trips || [])" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm font-semibold">📥 CSV</button>
            </div>
          </div>
          <div class="overflow-x-auto min-h-[300px]">
            <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table_Trips">
              <thead>
                <tr class="bg-gray-50 text-gray-500 text-xs">
                  <th class="p-3">ID</th>
                  <th class="p-3">Trip Number</th>
                  <th class="p-3">Vehicle (Combination)</th>
                  <th class="p-3">Driver</th>
                  <th class="p-3">Start Date</th>
                  <th class="p-3">Total Spend (USD)</th>
                  <th class="p-3">Status</th>
                  <th class="p-3 text-center">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                ${tableRows || '<tr><td colspan="8" class="p-4 text-center text-gray-400">No active trips found. Click "Start New Trip" to register one.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    };

    function openTripFormModal(item = null) {
      const db = globalData || {};
      const combinations = db.Combinations || [];
      const trucks = db.Trucks || [];
      const trailers = db.Trailers || [];
      const drivers = db.Drivers || [];

      let combOptions = '<option value="">Select Vehicle Combination</option>';
      combinations.forEach(c => {
        const t = trucks.find(tr => String(tr.ID) === String(c.TruckID) || String(tr.PlateNumber) === String(c.TruckID));
        const tr = trailers.find(trl => String(trl.ID) === String(c.TrailerID) || String(trl.PlateNumber) === String(c.TrailerID));
        const tPlate = t ? (t.PlateNumber || t.Registration || t.ID) : c.TruckID;
        const trPlate = tr ? (tr.PlateNumber || tr.Registration || tr.ID) : 'No Trailer';
        const comboLabel = tPlate + '/' + trPlate;
        const selected = item && String(item.CombinationID) === String(c.ID) ? 'selected' : '';
        combOptions += '<option value="' + c.ID + '" ' + selected + '>' + comboLabel + '</option>';
      });

      let driverOptions = '<option value="">Select Driver</option>';
      drivers.forEach(d => {
        const dName = d.FullName || d.Name || d.ID;
        const selected = item && String(item.DriverID) === String(d.ID) ? 'selected' : '';
        driverOptions += '<option value="' + d.ID + '" ' + selected + '>' + dName + '</option>';
      });

      const editId = item ? item.ID : '';
      const tripNum = item ? (item.TripNumber || '') : ('TRP-' + Date.now().toString().slice(-4));
      const startDate = item ? (item.StartDate || '') : new Date().toISOString().split('T')[0];
      const statusActive = item && item.Status === 'Active' ? 'selected' : '';
      const statusCompleted = item && item.Status === 'Completed' ? 'selected' : '';
      const statusCancelled = item && item.Status === 'Cancelled' ? 'selected' : '';

      const html = `
        <form onsubmit="submitTripForm(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="hidden" id="t_edit_id" value="${editId}">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Trip Number</label>
            <input type="text" id="t_number" value="${tripNum}" required class="border p-2 rounded w-full text-sm outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Start Date</label>
            <input type="date" id="t_date" value="${startDate}" class="border p-2 rounded w-full text-sm outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Vehicle Combination</label>
            <select id="t_comb" required class="border p-2 rounded w-full text-sm outline-none bg-white">${combOptions}</select>
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Driver</label>
            <select id="t_driver" required class="border p-2 rounded w-full text-sm outline-none bg-white">${driverOptions}</select>
          </div>
          <div class="md:col-span-2">
            <label class="text-xs text-gray-500 block mb-1">Trip Status</label>
            <select id="t_status" class="border p-2 rounded w-full text-sm outline-none bg-white">
              <option value="Active" ${statusActive}>Active</option>
              <option value="Completed" ${statusCompleted}>Completed</option>
              <option value="Cancelled" ${statusCancelled}>Cancelled</option>
            </select>
          </div>
          <button type="submit" class="md:col-span-2 bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">
            ${item ? 'Update Trip' : 'Save Trip'}
          </button>
        </form>
      `;
      openFormModal(item ? 'Edit Trip: ' + item.TripNumber : 'Start New Trip', html);
    }

    function previewTripDetails(id) {
      const db = globalData || {};
      const trip = (db.Trips || []).find(t => String(t.ID) === String(id));
      if (!trip) return alert("Trip not found.");

      const combinations = db.Combinations || [];
      const trucks = db.Trucks || [];
      const trailers = db.Trailers || [];
      const drivers = db.Drivers || [];
      const garageList = db.Garage || [];
      const containers = db.Containers || [];

      const combination = combinations.find(c => String(c.ID) === String(trip.CombinationID));
      let displayVehicle = trip.CombinationID || 'N/A';
      if (combination) {
        const t = trucks.find(tr => String(tr.ID) === String(combination.TruckID) || String(tr.PlateNumber) === String(combination.TruckID));
        const tr = trailers.find(trl => String(trl.ID) === String(combination.TrailerID) || String(trl.PlateNumber) === String(combination.TrailerID));
        const tPlate = t ? (t.PlateNumber || t.Registration || t.ID) : combination.TruckID;
        const trPlate = tr ? (tr.PlateNumber || tr.Registration || tr.ID) : 'No Trailer';
        displayVehicle = tPlate + '/' + trPlate;
      }

      const driver = drivers.find(d => String(d.ID) === String(trip.DriverID));
      const driverName = driver ? (driver.FullName || driver.Name || driver.ID) : (trip.DriverID || 'N/A');

      const container = containers.find(c => String(c.TripID) === String(trip.ID) || String(c.TripID) === String(trip.TripNumber));
      const agreedAmount = container ? parseFloat(container.AgreedAmount || 0) : 0;
      const containerCurrency = container ? (container.Currency || 'USD') : 'USD';
      
      const tripExpenses = garageList.filter(g => String(g.TripID) === String(trip.ID) || String(g.TripID) === String(trip.TripNumber));
      const totalSpendUSD = tripExpenses.reduce((sum, g) => sum + (parseFloat(g.TotalUSD || g.PriceUSD) || 0), 0);
      
      let balanceDisplay = "";
      if (containerCurrency.toUpperCase() === "USD") {
        const netUSD = agreedAmount - totalSpendUSD;
        balanceDisplay = `<span class="font-bold ${netUSD >= 0 ? 'text-emerald-600' : 'text-red-600'}">$${netUSD.toFixed(2)} USD</span>`;
      } else {
        balanceDisplay = `<span class="font-semibold text-gray-800">${agreedAmount.toLocaleString()} ${containerCurrency} (Agreed) - $${totalSpendUSD.toFixed(2)} USD (Spent)</span>`;
      }

      let rowsHtml = "";
      if (tripExpenses.length > 0) {
        tripExpenses.forEach(e => {
          rowsHtml += '<tr>' +
            '<td class="p-2 border-b">' + (e.Date || '') + '</td>' +
            '<td class="p-2 border-b">' + (e.Item || '') + '</td>' +
            '<td class="p-2 border-b">' + (e.ShopRef || '') + '</td>' +
            '<td class="p-2 border-b font-bold text-red-600">$' + (parseFloat(e.TotalUSD || e.PriceUSD || 0)).toFixed(2) + '</td>' +
          '</tr>';
        });
      }

      const containerInfoHtml = container ? `
        <div class="bg-blue-50 p-3 rounded-lg border border-blue-200 mb-3 space-y-1">
          <p class="text-xs font-bold text-blue-900 uppercase">📦 Linked Container Details</p>
          <div class="flex justify-between text-xs"><span class="text-gray-600">Container No:</span><span class="font-semibold text-gray-800">${container.ContainerNo}</span></div>
          <div class="flex justify-between text-xs"><span class="text-gray-600">Client:</span><span class="font-semibold text-gray-800">${container.Client || 'N/A'}</span></div>
          <div class="flex justify-between text-xs"><span class="text-gray-600">Agreed Amount:</span><span class="font-bold text-blue-700">${agreedAmount.toLocaleString()} ${containerCurrency}</span></div>
        </div>
      ` : `<div class="bg-gray-50 p-2 rounded text-xs text-gray-400 italic mb-3">No container linked to this trip yet.</div>`;

      const financialSummaryHtml = `
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 mb-3 space-y-1.5">
          <p class="text-xs font-bold text-slate-800 uppercase">💰 Financial P&L Balance</p>
          <div class="flex justify-between text-xs"><span class="text-gray-600">Agreed Amount:</span><span class="font-bold text-blue-600">${agreedAmount.toLocaleString()} ${containerCurrency}</span></div>
          <div class="flex justify-between text-xs"><span class="text-gray-600">Total Spend:</span><span class="font-bold text-red-600">$${totalSpendUSD.toFixed(2)} USD</span></div>
          <div class="flex justify-between text-xs border-t pt-1"><span class="font-bold text-gray-700">Net P&L Balance:</span>${balanceDisplay}</div>
        </div>
      `;

      const expensesHtml = tripExpenses.length > 0 ? 
        '<div class="mt-2">' +
          '<h4 class="font-bold text-gray-700 text-sm mb-2">All trip Spendings (' + tripExpenses.length + ')</h4>' +
          '<table class="w-full text-xs border border-collapse">' +
            '<thead><tr class="bg-gray-100 text-left"><th class="p-2 border">Date</th><th class="p-2 border">Item</th><th class="p-2 border">Shop Ref</th><th class="p-2 border">Amount (USD)</th></tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
          '</table>' +
        '</div>' : 
        '<p class="text-xs text-gray-400 mt-2 italic">No garage expenses recorded for this trip yet.</p>';

      const modalHtml = `
        <div id="printableTripContent" class="space-y-3 text-sm text-gray-700 bg-white p-2">
          <div class="flex justify-between border-b pb-1"><span class="font-medium text-gray-500">Trip Number:</span><span class="font-bold text-blue-600">${trip.TripNumber}</span></div>
          <div class="flex justify-between border-b pb-1"><span class="font-medium text-gray-500">Vehicle Combination:</span><span class="font-semibold text-gray-800">🚛 ${displayVehicle}</span></div>
          <div class="flex justify-between border-b pb-1"><span class="font-medium text-gray-500">Driver:</span><span class="font-semibold text-gray-800">👤 ${driverName}</span></div>
          <div class="flex justify-between border-b pb-1"><span class="font-medium text-gray-500">Start Date:</span><span class="font-semibold text-gray-800">${trip.StartDate || 'N/A'}</span></div>
          <div class="flex justify-between border-b pb-1"><span class="font-medium text-gray-500">Status:</span><span class="font-semibold text-emerald-600">${trip.Status || 'Active'}</span></div>
          
          ${containerInfoHtml}
          ${financialSummaryHtml}
          ${expensesHtml}
        </div>
      `;

      document.getElementById("modalTitle").innerHTML = `
        <div class="flex justify-between items-center w-full">
          <span>Trip Summary: ${trip.TripNumber}</span>
          <button onclick="printTripModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1">
            🖨️ Print / Download PDF
          </button>
        </div>
      `;
      document.getElementById("modalBody").innerHTML = modalHtml;
      document.getElementById("previewModal").classList.remove("hidden");
    }

    function printTripModal() {
      const printContents = document.getElementById("printableTripContent").innerHTML;
      const originalContents = document.body.innerHTML;

      document.body.innerHTML = `
        <div style="font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto;">
          <h2 style="text-align: center; color: #1e3a8a; margin-bottom: 5px;">FLEETDESK - TRIP FINANCIAL REPORT</h2>
          <p style="text-align: center; font-size: 12px; color: #6b7280; margin-bottom: 20px;">Generated on: ${new Date().toLocaleString()}</p>
          <hr style="border: 0; border-top: 1px solid #e5e7eb; margin-bottom: 20px;" />
          ${printContents}
        </div>
      `;

      window.print();
      document.body.innerHTML = originalContents;
      window.location.reload(); // Reload to restore event listeners
    }

    window.onEditTriggered = function(sheetName, item) {
      if (sheetName === 'Trips') openTripFormModal(item);
    };

    async function submitTripForm(e) {
      e.preventDefault();
      const editId = document.getElementById("t_edit_id").value;
      const data = {
        ID: editId || ("TRP-" + Date.now().toString().slice(-4)),
        TripNumber: document.getElementById("t_number").value,
        StartDate: document.getElementById("t_date").value,
        CombinationID: document.getElementById("t_comb").value,
        DriverID: document.getElementById("t_driver").value,
        Status: document.getElementById("t_status").value
      };
      await sendToServer("Trips", editId ? "update" : "add", data);
    }

    fetchDatabase();
  </script>
</body>
</html>
